                            paddingTop: r.cats?.length ? 6 : 0,
                            borderTop: r.cats?.length ? '1px solid var(--border)' : 'none',
                          }}>
                            {r.memo}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              );
            })}

            <div style={{ height:8 }} />
          </div>
        ))}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   相談メモ
═══════════════════════════════════════════════════ */
function ReportScreen({ persons, records, checkHistory }) {
  const [from, setFrom] = useState('2025-04-01');
  const [to,   setTo]   = useState('2025-05-31');
  const [pid,  setPid]  = useState(persons[0]?.id || '');
  const [show, setShow] = useState(false);

  const person   = persons.find(p => p.id === Number(pid));
  const filtered = records.filter(r => r.personId === Number(pid) && r.date >= from && r.date <= to);
  const catCounts = {};
  filtered.forEach(r => r.cats?.forEach(c => { catCounts[c] = (catCounts[c]||0)+1; }));

  /* ─ チェック推移（相談メモ用） ─ */
  const myChecks = checkHistory
    .filter(c => c.personId === Number(pid) && c.date >= from && c.date <= to)
    .sort((a,b) => a.date.localeCompare(b.date));
  const trendMonths = {};
  checkHistory.filter(c => c.personId === Number(pid))
    .sort((a,b) => a.date.localeCompare(b.date))
    .forEach(c => {
      const m = c.targetMonth || c.date.slice(0,7);
      if (!trendMonths[m]) trendMonths[m] = 0;
      trendMonths[m] = Math.max(trendMonths[m], c.count || 0);
    });
  const trendKeys = Object.keys(trendMonths).sort().slice(-6);
  const fmtMoFull = m => { const [y,mo] = m.split('-'); return `${y}年${Number(mo)}月`; };

  return (
    <div className="page anim">
      <div className="page-header">
        <h1>相談メモ</h1>
        <p>医師・ケアマネ・地域包括支援センターへ</p>
      </div>
      <div className="page-body">
        {/* 目的説明（常時表示） */}
        <div className="alert alert-info" style={{ marginBottom:14, borderRadius:12 }}>
          <Ic n="info" s={15} c="var(--primary)" />
          <p style={{ fontSize:13, color:'var(--primary-dark)', lineHeight:1.65 }}>
            この相談メモは、特定の家族について医療・介護・福祉の専門職へ相談する際に利用するための資料です。
          </p>
        </div>

        {!show ? (
          <>
            <div className="card">
              <div className="card-title"><Ic n="file" s={14} c="var(--text-sub)" />相談メモの設定</div>
              <div className="form-group">
                <label className="form-label">相談したい家族</label>
                <select className="form-input" value={pid} onChange={e => { setPid(e.target.value); }}>
                  {persons.map(p => <option key={p.id} value={p.id}>{p.emoji} {p.name}（{p.relation}）</option>)}
                </select>
                <div style={{ fontSize:12, color:'var(--text-sub)', marginTop:6 }}>
                  複数の家族の記録をまとめて確認したい場合は「記録カレンダー」をご利用ください。
                </div>
              </div>
              <label className="form-label">期間</label>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
                <input type="date" className="form-input" value={from} onChange={e => setFrom(e.target.value)} />
                <input type="date" className="form-input" value={to}   onChange={e => setTo(e.target.value)} />
              </div>
              <div style={{ marginTop:14, padding:'10px 12px', background:'var(--bg)', borderRadius:10 }}>
                <div style={{ fontSize:13, color:'var(--text-sub)' }}>
                  {person?.emoji} {person?.name}さんの記録:&nbsp;
                  <b style={{ color:'var(--primary)' }}>{filtered.length}件</b>
                </div>
              </div>
            </div>
            <button className="btn btn-primary btn-full" onClick={() => setShow(true)}>
              <Ic n="file" s={18} c="#fff" />相談メモを表示する
            </button>
          </>
        ) : (
          <>
            <div className="card" style={{ border:'2px solid var(--primary)' }}>
              <div style={{ textAlign:'center', paddingBottom:14, marginBottom:14, borderBottom:'2px solid var(--primary-bg)' }}>
                <div style={{ fontSize:11, color:'var(--text-sub)', letterSpacing:.8 }}>実家見守りノート</div>
                <div style={{ fontSize:18, fontWeight:800, color:'var(--text)', marginTop:4 }}>生活変化・相談メモ</div>
                <div style={{ fontSize:12, color:'var(--text-sub)', marginTop:4 }}>{from} 〜 {to}</div>
              </div>

              <div style={{ marginBottom:16 }}>
                <div className="report-h3">基本情報</div>
                <div className="report-row">
                  <span>対象</span>
                  <span style={{ fontWeight:700 }}>{person?.emoji} {person?.name}（{person?.relation}）</span>
                </div>
                <div className="report-row">
                  <span>記録件数</span>
                  <span style={{ fontWeight:700 }}>{filtered.length}件</span>
                </div>
                <div className="report-row">
                  <span>作成日</span>
                  <span>{new Date().toLocaleDateString('ja-JP')}</span>
                </div>
              </div>

              {/* ── 気づき記録まとめ ── */}
              <div style={{ marginBottom:16 }}>
                <div className="report-h3">【気づき記録】 事実の記録</div>
                {Object.keys(catCounts).length > 0
                  ? Object.entries(catCounts).sort((a,b)=>b[1]-a[1]).map(([cat,cnt]) => (
                      <div key={cat} className="report-row">
                        <span>{CAT_EMOJI[cat]||'●'} {cat}</span>
                        <span style={{ fontWeight:700, color: cnt>=3 ? 'var(--accent)' : 'var(--text)' }}>{cnt}件</span>
                      </div>
                    ))
                  : <div style={{ fontSize:13, color:'var(--text-sub)', padding:'4px 0' }}>この期間の気づき記録はありません</div>
                }
              </div>

              {/* ── 生活変化チェックまとめ（月別） ── */}
              <div style={{ marginBottom:16 }}>
                <div className="report-h3">【生活変化チェック】 月ごとの振り返り</div>
                {(() => {
                  if (myChecks.length === 0) return (
                    <div style={{ fontSize:13, color:'var(--text-sub)', padding:'4px 0' }}>この期間のチェック記録はありません</div>
                  );
                  /* 月別にまとめる */
                  const moMap = {};
                  myChecks.forEach(c => {
                    const m = c.targetMonth || c.date.slice(0,7);
                    if (!moMap[m]) moMap[m] = { ids: new Set(), impression:'', note:'' };
                    (c.checkedIds||[]).forEach(id => moMap[m].ids.add(id));
                    if (c.impression) moMap[m].impression = c.impression;
                    if (c.note)       moMap[m].note = c.note;
                  });
                  return Object.keys(moMap).sort().reverse().map(m => {
                    const items = [...moMap[m].ids].map(id => CHECK_QS.find(q => q.id === id)?.text).filter(Boolean);
                    return (
                      <div key={m} style={{ marginBottom:14, paddingBottom:14, borderBottom:'1px solid var(--border)' }}>
                        <div style={{ fontSize:14, fontWeight:700, color:'var(--primary-dark)', marginBottom:6 }}>
                          【{fmtTargetMonth(m)}の生活変化チェック】
                        </div>
                        {moMap[m].impression && (
                          <div className="report-row" style={{ marginBottom:4 }}>
                            <span>家族の印象</span>
                            <span style={{ fontWeight:700 }}>{moMap[m].impression}</span>
                          </div>
                        )}
                        {items.length > 0 && (
                          <div style={{ marginBottom: moMap[m].note ? 6 : 0 }}>
                            <div style={{ fontSize:12, color:'var(--text-sub)', marginBottom:4 }}>選択した項目</div>
                            {items.map(t => (
                              <div key={t} style={{ fontSize:13, padding:'2px 0 2px 10px' }}>・{t}</div>
                            ))}
                          </div>
                        )}
                        {moMap[m].note && (
                          <div style={{ marginTop:6 }}>
                            <div style={{ fontSize:12, color:'var(--text-sub)', marginBottom:4 }}>この1か月を振り返って感じたこと</div>
                            <div style={{ fontSize:13, lineHeight:1.7, whiteSpace:'pre-wrap', color:'var(--text-sub)' }}>{moMap[m].note}</div>
                          </div>
                        )}
                        {items.length === 0 && !moMap[m].note && (
                          <div style={{ fontSize:13, color:'var(--text-sub)', paddingLeft:10 }}>特に気になる変化はありませんでした</div>
                        )}
                      </div>
                    );
                  });
                })()}
              </div>

              {/* ─ 変化の推移 ─ */}
              {trendKeys.length > 0 && (
                <div style={{ marginBottom:16 }}>
                  <div className="report-h3">変化の推移（気になった項目数）</div>
                  {trendKeys.map((m, i) => {
                    const cnt  = trendMonths[m];
                    const prev = i > 0 ? trendMonths[trendKeys[i-1]] : null;
                    const diff = prev !== null ? cnt - prev : null;
                    return (
                      <div key={m} className="report-row">
                        <span>{fmtMoFull(m)}&emsp;{cnt}項目</span>
                        {diff !== null && diff !== 0 && (
                          <span style={{ fontWeight:700, color: diff > 0 ? 'var(--accent)' : 'var(--green)', fontSize:12 }}>
                            {diff > 0 ? `▲${diff}` : `▼${Math.abs(diff)}`}
                          </span>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}

              <div>
                <div className="report-h3">記録一覧</div>
                {filtered.slice(0,8).map(r => (
                  <div key={r.id} style={{ padding:'8px 0', borderBottom:'1px solid var(--border)' }}>
                    <div style={{ fontSize:11, color:'var(--text-sub)' }}>{r.date} {r.time}</div>
                    <div style={{ fontSize:13, fontWeight:600, color:'var(--text)', marginTop:2 }}>{r.cats?.join('・')||'メモ'}</div>
                    {r.memo && <div style={{ fontSize:12, color:'var(--text-sub)', marginTop:2 }}>{r.memo}</div>}
                  </div>
                ))}
                {filtered.length === 0 && <div style={{ fontSize:13, color:'var(--text-sub)' }}>この期間の記録はありません</div>}
              </div>

              <div style={{ marginTop:14, padding:'10px 12px', background:'var(--primary-bg)', borderRadius:10, fontSize:12, color:'var(--primary-dark)', lineHeight:1.65 }}>
                📌 このメモは、実家見守りノートで記録した内容をもとに作成されています。医師・ケアマネジャーに見せて、専門家のアドバイスを受けてください。
              </div>
            </div>
            <div style={{ display:'flex', gap:10, marginTop:4 }}>
              <button className="btn btn-outline" style={{ flex:1 }} onClick={() => setShow(false)}>
                <Ic n="left" s={16} c="var(--primary)" />設定に戻る
              </button>
              <button className="btn btn-primary" style={{ flex:1 }}
                onClick={() => {
                  /* ── PDF印刷用コンテンツを組み立ててブラウザ印刷 ── */
                  const fmtMo = m => { const [y,mo] = m.split('-'); return `${y}年${Number(mo)}月`; };
                  const rows = filtered.slice(0,20).map(r =>
                    `<tr><td>${r.date} ${r.time}</td><td>${r.cats?.join('・')||'メモ'}</td><td>${r.memo||''}</td></tr>`
                  ).join('');
                  /* 気づき記録セクション */
                  /* ── 【1】気づき記録：日時＋内容リスト ── */
                  const kidzukiList = filtered
                    .slice(0, 30)
                    .map(r => {
                      const dateStr = r.date ? r.date.replace(/-/g,'/') : '';
                      const cats    = r.cats?.join('・') || '';
                      const memo    = r.memo ? `<div style="color:#6B7F8E;font-size:11px;margin-top:2px">${r.memo}</div>` : '';
                      return `<div style="padding:6px 0;border-bottom:1px solid #DDE8ED">
                        <div style="font-size:11px;color:#6B7F8E">${dateStr}${r.time ? ' ' + r.time : ''}</div>
                        <div style="font-size:13px;font-weight:600;margin-top:2px">${cats || 'メモ'}</div>
                        ${memo}
                      </div>`;
                    }).join('');

                  /* ── 【2】生活変化チェック：月別（印象・自由記述含む） ── */
                  const checksByMonth = {};
                  myChecks.forEach(c => {
                    const m = c.targetMonth || c.date.slice(0,7);
                    if (!checksByMonth[m]) checksByMonth[m] = { ids: new Set(), impression:'', note:'' };
                    (c.checkedIds||[]).forEach(id => checksByMonth[m].ids.add(id));
                    if (c.impression) checksByMonth[m].impression = c.impression;
                    if (c.note)       checksByMonth[m].note = c.note;
                  });
                  const checkMonthRows = Object.keys(checksByMonth).sort().reverse().map(m => {
                    const [y, mo] = m.split('-');
                    const items = [...checksByMonth[m].ids]
                      .map(id => CHECK_QS.find(q => q.id === id)?.text)
                      .filter(Boolean)
                      .map(t => `<div style="padding:2px 0 2px 10px;font-size:12px">・${t}</div>`)
                      .join('');
                    const impRow = checksByMonth[m].impression
                      ? `<div style="font-size:12px;margin:4px 0"><b>家族の印象：</b>${checksByMonth[m].impression}</div>` : '';
                    const noteRow = checksByMonth[m].note
                      ? `<div style="font-size:12px;color:#6B7F8E;margin-top:4px;white-space:pre-wrap">${checksByMonth[m].note}</div>` : '';
                    return `<div style="margin-bottom:12px;padding-bottom:10px;border-bottom:1px solid #DDE8ED">
                      <div style="font-size:13px;font-weight:700;color:#2E6E82;margin-bottom:4px">【${y}年${Number(mo)}月の生活変化チェック】</div>
                      ${impRow}
                      ${items ? `<div style="font-size:12px;margin-top:4px">選択した項目</div>${items}` : '<div style="font-size:12px;color:#6B7F8E;padding-left:10px">特に気になる変化はありませんでした</div>'}
                      ${noteRow}
                    </div>`;
                  }).join('');

                  /* ── 【4】相談先一覧 ── */
                  const consultees = person?.consultees || [];
                  const consultRows = consultees.map(c => {
                    const typeLabel = CONSULT_TYPES.find(t => t.value === c.type)?.label || 'その他';
                    const contact   = c.contact ? `<div style="font-size:11px;color:#6B7F8E;margin-top:2px">📞 ${c.contact}</div>` : '';
                    const memo      = c.memo    ? `<div style="font-size:11px;color:#6B7F8E;margin-top:3px;white-space:pre-wrap">${c.memo}</div>` : '';
                    return `<div style="padding:8px 0;border-bottom:1px solid #DDE8ED">
                      <div style="font-size:11px;color:#4A90A4;font-weight:700">${typeLabel}</div>
                      <div style="font-size:13px;font-weight:700;margin-top:2px">${c.name}</div>
                      ${contact}${memo}
                    </div>`;
                  }).join('');

                  document.getElementById('print-area').innerHTML = `
                    <div class="p-header">
                      <div><div class="p-appname">実家見守りノート</div><h1>生活変化・相談メモ</h1><p class="p-sub">${from} 〜 ${to}</p></div>
                      <div style="text-align:right"><p class="p-sub">作成日: ${new Date().toLocaleDateString('ja-JP')}</p></div>
                    </div>

                    <h2>基本情報</h2>
                    <table>
                      <tr><td>対象</td><td><b>${person?.emoji} ${person?.name}（${person?.relation}）</b></td></tr>
                      <tr><td>記録件数</td><td><b>${filtered.length}件</b></td></tr>
                      <tr><td>期間</td><td>${from} 〜 ${to}</td></tr>
                    </table>

                    <h2>【気づき記録】 観察した事実</h2>
                    ${kidzukiList || '<p style="color:#6B7F8E;font-size:12px">この期間の気づき記録はありません</p>'}

                    <h2>【生活変化チェック】 確認した項目</h2>
                    ${checkMonthRows || '<p style="color:#6B7F8E;font-size:12px">この期間のチェック記録はありません</p>'}

                    ${consultRows ? `<div class="p-consult-list"><h2>相談先一覧</h2>${consultRows}</div>` : ''}

                    <div class="p-note">📌 このメモは実家見守りノートで記録した内容をもとに作成されています。医師・ケアマネジャーに見せて、専門家のアドバイスを受けてください。</div>
                  `;
                  window.print();
                  setTimeout(() => { document.getElementById('print-area').innerHTML = ''; }, 1000);
                }}>
                🖨 PDFで保存
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

/* ── SettingsScreen 家族カード（展開式） ── */
function PersonCard({ person, onUpdate, onDelete }) {
  const EMOJIS = ['👨','👩','👴','👵','🧑','👦','👧'];
  const PRESET_TIMES = ['07:00','09:00','12:00','18:00','20:00','22:00'];
  const [open, setOpen] = useState(false);
  const [editName, setEditName] = useState(person.name);
  const [editRel,  setEditRel]  = useState(person.relation);
  const [editEmoji, setEditEmoji] = useState(person.emoji);

  const saveBasic = () => {
    if (!editName) return;
    onUpdate({ ...person, name: editName, relation: editRel, emoji: editEmoji });
  };

  const checkDay    = person.checkDay || '1';
  const notify      = person.notifyTime || '';
  const due         = isCheckDue(person);
  const nextDate    = getNextCheckDate(person);
  const nextDateStr = `${nextDate.getFullYear()}年${nextDate.getMonth()+1}月${nextDate.getDate()}日`;

  return (
    <div className="card" style={{ padding:0, overflow:'hidden', marginBottom:10 }}>
      {/* ヘッダー行 */}
      <div
        onClick={() => setOpen(o => !o)}
        style={{ display:'flex', alignItems:'center', padding:'13px 14px', cursor:'pointer', gap:12 }}>
        <div style={{ fontSize:26, flexShrink:0 }}>{person.emoji}</div>
        <div style={{ flex:1 }}>
          <div style={{ fontWeight:700, fontSize:15, color:'var(--text)' }}>{person.name}（{person.relation}）</div>
          <div style={{ fontSize:12, color:'var(--text-sub)', marginTop:2 }}>
            毎月{checkDay === '末' ? '末日' : `${checkDay}日`}にチェック
            {due && <span style={{ color:'var(--accent)', fontWeight:700, marginLeft:8 }}>🔔 時期です</span>}
          </div>
        </div>
        <button onClick={e => { e.stopPropagation(); onDelete(person.id); }}
          style={{ background:'none', border:'none', cursor:'pointer', padding:'4px 6px', marginRight:4 }}>
          <Ic n="trash" s={16} c="var(--text-light)" />
        </button>
        <span style={{ fontSize:12, color:'var(--text-light)', transition:'transform .2s', display:'inline-block', transform: open ? 'rotate(90deg)' : 'rotate(0deg)' }}>▶</span>
      </div>

      {open && (
        <div style={{ borderTop:'1px solid var(--border)', padding:'14px 14px 16px' }}>
          {/* ── 基本情報編集 ── */}
          <div style={{ fontSize:13, fontWeight:700, color:'var(--text-sub)', marginBottom:10, textTransform:'uppercase', letterSpacing:'.04em' }}>基本情報</div>
          <div className="form-group">
            <label className="form-label">名前</label>
            <input className="form-input" value={editName} onChange={e => setEditName(e.target.value)} onBlur={saveBasic} />
          </div>
          <div className="form-group">
            <label className="form-label">続柄</label>
            <input className="form-input" value={editRel} onChange={e => setEditRel(e.target.value)} onBlur={saveBasic} placeholder="父、母、祖母など" />
          </div>
          <div className="form-group">
            <label className="form-label">アイコン</label>
            <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
              {EMOJIS.map(em => (
                <button key={em} onClick={() => { setEditEmoji(em); onUpdate({ ...person, emoji: em, name: editName, relation: editRel }); }}
                  style={{ width:40, height:40, fontSize:22, background: editEmoji===em ? 'var(--primary-bg)' : 'var(--bg)', border: editEmoji===em ? '2px solid var(--primary)' : '2px solid transparent', borderRadius:10, cursor:'pointer' }}>
                  {em}
                </button>
              ))}
            </div>
          </div>

          {/* ── チェック設定 ── */}
          <div style={{ fontSize:13, fontWeight:700, color:'var(--text-sub)', margin:'16px 0 10px', textTransform:'uppercase', letterSpacing:'.04em' }}>チェック設定</div>

          {/* 前回 / 次回 */}
          <div style={{ background:'var(--bg)', borderRadius:10, padding:'10px 12px', marginBottom:12 }}>
            <div style={{ display:'flex', justifyContent:'space-between', padding:'5px 0', borderBottom:'1px solid var(--border)' }}>
              <span style={{ fontSize:13, color:'var(--text-sub)' }}>前回チェック</span>
              <span style={{ fontSize:13, fontWeight:700 }}>
                {person.lastCheckDate ? fmtTargetMonth(person.lastCheckDate.slice(0,7)) : '未実施'}
              </span>
            </div>
            <div style={{ display:'flex', justifyContent:'space-between', padding:'5px 0' }}>
              <span style={{ fontSize:13, color:'var(--text-sub)' }}>次回チェック予定日</span>
              <span style={{ fontSize:13, fontWeight:700, color: due ? 'var(--accent)' : 'var(--text)' }}>
                {nextDateStr}{due && ' ⚠'}
              </span>
            </div>
          </div>

          {/* 毎月のチェック日 */}
          <label className="form-label">毎月のチェック日</label>
          <div style={{ display:'grid', gridTemplateColumns:'repeat(4,1fr)', gap:6, marginBottom:12 }}>
            {CHECK_DAYS.map(d => {
              const active = checkDay === d;
              return (
                <button key={d} onClick={() => onUpdate({ ...person, checkDay: d })}
                  style={{ padding:'10px 4px', borderRadius:10,
                    border:`2px solid ${active?'var(--primary)':'var(--border)'}`,
                    background: active?'var(--primary-bg)':'var(--surface)',
                    color: active?'var(--primary)':'var(--text-sub)',
                    fontWeight: active?700:500, fontSize:14,
                    cursor:'pointer', fontFamily:'inherit', textAlign:'center' }}>
                  {d === '末' ? '末日' : `${d}日`}
                </button>
              );
            })}
          </div>

          {/* 通知時間 */}
          <label className="form-label">通知時間（アプリ内表示）</label>
          <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginBottom:10 }}>
            {PRESET_TIMES.map(t => {
              const active = notify === t;
              return (
                <button key={t} onClick={() => onUpdate({ ...person, notifyTime: active ? '' : t })}
                  style={{ padding:'6px 12px', borderRadius:20, border:`1.5px solid ${active?'var(--primary)':'var(--border)'}`, background: active?'var(--primary)':'var(--surface)', color: active?'#fff':'var(--text)', fontSize:13, fontWeight: active?700:400, cursor:'pointer', fontFamily:'inherit' }}>
                  {t}
                </button>
              );
            })}
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <span style={{ fontSize:13, color:'var(--text-sub)', flexShrink:0 }}>時刻指定</span>
            <input type="time" className="form-input" style={{ flex:1 }} value={notify}
              onChange={e => onUpdate({ ...person, notifyTime: e.target.value })} />
            {notify && (
              <button onClick={() => onUpdate({ ...person, notifyTime: '' })}
                style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-light)', flexShrink:0 }}>✕</button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════════════ */
function App() {
  const [persons,      setPersons]      = useState(() => load('mmn_persons',  SEED_PERSONS));
  const [records,      setRecords]      = useState(() => load('mmn_records',  SEED_RECORDS));
  const [checkHistory, setCheckHistory] = useState(() => load('mmn_checks',   SEED_CHECKS));
  const [screen,      setScreen]      = useState('home');
  const [modal,       setModal]       = useState(null);
  const [checkTarget, setCheckTarget] = useState(null); /* 家族詳細からチェックを直接開始する対象 */
  const [deleteConfirmId, setDeleteConfirmId] = useState(null); /* 削除確認ダイアログ */
  const [hintLoadError, setHintLoadError] = useState(false); /* JSON読み込み失敗フラグ */
  const [, forceHintUpdate] = useState(0); /* JSON読み込み完了後の再レンダリング用 */

  useEffect(() => {
    _onHintMasterUpdated = status => {
      if (status === 'error') setHintLoadError(true);
      forceHintUpdate(n => n + 1);
    };
    return () => { _onHintMasterUpdated = null; };
  }, []);

  useEffect(() => { save('mmn_persons',  persons);      }, [persons]);
  useEffect(() => { save('mmn_records',  records);      }, [records]);
  useEffect(() => { save('mmn_checks',   checkHistory); }, [checkHistory]);

  const handleNav = s => {
    if (s.startsWith('family_')) { setScreen(s); return; }
    setScreen(s);
  };

  const saveRecord = rec => {
    setRecords(prev => {
      const exists = prev.find(r => r.id === rec.id);
      return exists ? prev.map(r => r.id === rec.id ? rec : r) : [rec, ...prev];
    });
    setModal(null);
    setScreen('records');
  };

  const deleteRecord = id => setDeleteConfirmId(id);
  const confirmDeleteRecord = () => {
    setRecords(p => p.filter(r => r.id !== deleteConfirmId));
    setDeleteConfirmId(null);
  };

  const saveCheck = ({ person, ans, res, checked, impression, note, targetYM }) => {
    const today = new Date().toISOString().split('T')[0];
    const now   = new Date().toTimeString().slice(0,5);
    const tm    = targetYM || today.slice(0,7);
    /* 記録として保存 */
    const impText = impression ? `・全体的な印象：${impression}` : '';
    const rec = {
      id: Date.now(),
      date: today, time: now,
      personId: person.id,
      cats: checked.map(q => q.text),
      memo: `【${fmtTargetMonth(tm)}の生活変化チェック】${impText}${note ? '\n' + note : ''}`,
      place: '', fromCheck: true,
    };
    setRecords(p => [rec, ...p]);
    /* チェック履歴として保存 */
    const hist = {
      id: Date.now() + 1,
      personId: person.id,
      date: today,
      targetMonth: tm,
      checkedIds: Object.entries(ans).filter(([,v]) => v).map(([k]) => k),
      count: checked.length,
      level: res.level,
      impression: impression || '',
      note: note || '',
    };
    setCheckHistory(p => [hist, ...p]);
    /* 家族の lastCheckDate を更新 */
    setPersons(prev => prev.map(p => p.id === person.id ? { ...p, lastCheckDate: today } : p));
    setScreen('home');
  };

  const addPerson    = p   => setPersons(prev => [...prev, p]);
  const updatePerson = p   => setPersons(prev => prev.map(x => x.id === p.id ? p : x));
  const deletePerson = id => {
    if (window.confirm('この家族を削除しますか？')) setPersons(p => p.filter(x => x.id !== id));
  };

  const NAV = [
    { id:'home',    label:'ホーム',   icon:'home'   },
    { id:'records', label:'記録',     icon:'pencil' },
    { id:'report',  label:'相談メモ', icon:'file'   },
    { id:'settings',label:'設定',     icon:'gear'   },
  ];

  const showNav = modal === null && !screen.startsWith('family_') && screen !== 'check';

  /* ─ modal: record form ─ */
  if (modal) {
    const initPid = modal.personId || null;
    return (
      <>
        <RecordForm
          persons={persons}
          initialPersonId={initPid}
          initial={modal.initialRecord || null}
          onBack={() => setModal(null)}
          onSave={saveRecord}
        />
      </>
    );
  }

  /* ─ family detail ─ */
  if (screen.startsWith('family_')) {
    const pid    = Number(screen.split('_')[1]);
    const person = persons.find(p => p.id === pid);
    if (!person) { setScreen('home'); return null; }
    return (
      <>
        <FamilyScreen
          person={person} records={records} checkHistory={checkHistory}
          onBack={() => setScreen('home')}
          onAddRecord={personId => setModal({ personId })}
          onEditRecord={r => setModal({ personId: r.personId, initialRecord: r })}
          onDeleteRecord={deleteRecord}
          onUpdatePerson={updatePerson}
          onStartCheck={p => { setCheckTarget(p); setScreen('check'); }}
        />
      </>
    );
  }

  /* ─ named screens ─ */
  const renderScreen = () => {
    switch (screen) {
      case 'home':
        return <HomeScreen persons={persons} records={records} checkHistory={checkHistory} onNav={handleNav} onRecordAdd={() => setModal({ personId: null })} />;
      case 'check':
        return <CheckScreen persons={persons} initialPerson={checkTarget}
                  onBack={() => { setCheckTarget(null); setScreen('home'); }}
                  onSave={(...args) => { setCheckTarget(null); saveCheck(...args); }} />;
      case 'records':
        return <RecordsScreen persons={persons} records={records} onAddRecord={pid => setModal({ personId: pid })} onDeleteRecord={deleteRecord} onEditRecord={r => setModal({ personId: r.personId, initialRecord: r })} />;
      case 'report':
        return <ReportScreen persons={persons} records={records} checkHistory={checkHistory} />;
      case 'settings':
        return <SettingsScreen
          persons={persons} records={records} checkHistory={checkHistory}
          onAddPerson={addPerson} onUpdatePerson={updatePerson} onDeletePerson={deletePerson}
          onRestore={(data) => {
            if (data.persons)      { setPersons(data.persons);           save('mmn_persons', data.persons); }
            if (data.records)      { setRecords(data.records);           save('mmn_records', data.records); }
            if (data.checkHistory) { setCheckHistory(data.checkHistory); save('mmn_checks',  data.checkHistory); }
          }}
        />;
      default:
        return null;
    }
  };

  return (
    <>
      {/* JSON読み込み失敗バナー（記録機能は使えることを明示） */}
      {hintLoadError && (
        <div style={{
          position:'fixed', top:0, left:0, right:0, zIndex:10000,
          background:'#FFF3CD', color:'#856404', padding:'8px 16px',
          fontSize:13, textAlign:'center', borderBottom:'1px solid #FFE69C',
        }}>
          入力例を読み込めませんでした。詳細メモに直接入力してください。
        </div>
      )}
      {renderScreen()}
      {showNav && (
        <nav className="bottom-nav">
          {NAV.map(item => (
            <button key={item.id} className={`nav-btn ${screen===item.id?'active':''}`} onClick={() => setScreen(item.id)}>
              <Ic n={item.icon} s={22} c={screen===item.id ? 'var(--primary)' : 'var(--text-light)'} />
              <span>{item.label}</span>
            </button>
          ))}
        </nav>
      )}

      {/* ─ 削除確認ダイアログ ─ */}
      {deleteConfirmId !== null && (
        <div style={{
          position:'fixed', inset:0, background:'rgba(0,0,0,0.45)',
          display:'flex', alignItems:'center', justifyContent:'center',
          zIndex:9999, padding:'0 24px',
        }}>
          <div style={{
            background:'var(--surface)', borderRadius:16, padding:'28px 24px 20px',
            width:'100%', maxWidth:340, boxShadow:'0 8px 32px rgba(0,0,0,0.18)',
          }}>
            <div style={{ fontSize:18, fontWeight:800, color:'var(--text)', marginBottom:10, textAlign:'center' }}>
              🗑️ 記録を削除
            </div>
            <div style={{ fontSize:14, color:'var(--text-sub)', lineHeight:1.7, textAlign:'center', marginBottom:24 }}>
              この記録を削除しますか？<br/>
              <span style={{ fontSize:12, color:'var(--text-light)' }}>削除したデータは元に戻せません。</span>
            </div>
            <div style={{ display:'flex', gap:10 }}>
              <button
                onClick={() => setDeleteConfirmId(null)}
                style={{
                  flex:1, padding:'12px 0', borderRadius:10, border:'1.5px solid var(--border)',
                  background:'var(--bg)', color:'var(--text)', fontSize:15, fontWeight:600,
                  cursor:'pointer', fontFamily:'inherit',
                }}>
                キャンセル
              </button>
              <button
                onClick={confirmDeleteRecord}
                style={{
                  flex:1, padding:'12px 0', borderRadius:10, border:'none',
                  background:'#D9534F', color:'#fff', fontSize:15, fontWeight:700,
                  cursor:'pointer', fontFamily:'inherit',
                }}>
                削除する
              </button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
