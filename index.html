<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>くらしあと</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --primary:       #D4875A;
      --primary-light: #E8A87A;
      --primary-dark:  #B36A3A;
      --primary-bg:    #FDF3EC;
      --green:         #5A9E7A;
      --green-light:   #E8F5EE;
      --accent:        #D4875A;
      --accent-light:  #FDF3EC;
      --bg:            #FBF7F4;
      --surface:       #FFFFFF;
      --text:          #1F1F1F;
      --text-sub:      #3E3E3E;
      --text-light:    #2D2D2D;
      --border:        #E8DDD5;
      --shadow:        0 2px 10px rgba(180,120,80,0.10);
      --shadow-md:     0 4px 18px rgba(180,120,80,0.16);
      --r:             16px;
      --r-sm:          10px;
      --nav-h:         80px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      background: #C8B5A0;
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    #root {
      width: 390px; height: 844px;
      background: var(--bg);
      position: relative; overflow: hidden;
      border-radius: 42px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.28);
    }
    @media (max-width: 430px) {
      body { background: var(--bg); align-items: flex-start; }
      #root { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
    }

    /* ── Layout ── */
    .page { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
    .page-header {
      padding: 52px 20px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .page-header h1 { font-size: 26px; font-weight: 800; color: var(--text); }
    .page-header p  { font-size: 18px; color: var(--text-sub); margin-top: 4px; line-height: 1.5; }
    .page-body {
      flex: 1; overflow-y: auto; padding: 16px;
      padding-bottom: calc(var(--nav-h) + 16px);
    }
    .page-body::-webkit-scrollbar { display: none; }

    /* ── Bottom Nav ── */
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 4px 8px; z-index: 100;
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 4px;
      padding: 6px 4px; border: none; background: none; cursor: pointer;
      color: #5A5A5A; font-size: 15px; font-weight: 700; transition: color .2s;
    }
    .nav-btn.active { color: var(--primary); font-weight: 800; }

    /* ── Cards ── */
    .card { background: var(--surface); border-radius: var(--r); padding: 18px 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
    .card-title { font-size: 17px; font-weight: 700; color: var(--text); letter-spacing: .3px; margin-bottom: 12px; display: flex; align-items: center; gap: 6px; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: none; cursor: pointer; transition: all .18s; font-family: inherit;
      border-radius: 50px; min-height: 52px;
    }
    .btn-full { width: 100%; }
    .btn-primary { background: var(--primary); color: #fff; padding: 15px 20px; font-size: 18px; font-weight: 700; }
    .btn-primary:active { background: var(--primary-dark); transform: scale(.98); }
    .btn-green  { background: var(--green);   color: #fff; padding: 15px 20px; font-size: 18px; font-weight: 700; }
    .btn-orange { background: var(--accent);  color: #fff; padding: 15px 20px; font-size: 18px; font-weight: 700; }
    .btn-ghost  { background: var(--primary-bg); color: var(--primary-dark); padding: 15px 20px; font-size: 18px; font-weight: 700; }
    .btn-outline{ background: #fff; color: var(--primary-dark); border: 2px solid var(--primary); padding: 13px 20px; font-size: 18px; font-weight: 700; }
    .btn-sm     { padding: 10px 16px; font-size: 15px; border-radius: 20px; min-height: 44px; }
    .btn-icon   { background: var(--primary-bg); color: var(--primary); width: 40px; height: 40px; border-radius: 50%; padding: 0; min-height: unset; }

    /* ── Big action buttons (home) ── */
    .action-btn {
      display: flex; align-items: center; gap: 14px;
      padding: 20px; border-radius: var(--r);
      border: none; cursor: pointer; transition: transform .15s, box-shadow .15s;
      text-align: left; width: 100%; font-family: inherit; margin-bottom: 10px;
      box-shadow: var(--shadow); min-height: 72px;
    }
    .action-btn:active { transform: scale(.98); box-shadow: var(--shadow-md); }
    .action-btn-icon { width: 52px; height: 52px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 24px; flex-shrink: 0; }
    .action-btn-label { font-size: 20px; font-weight: 800; }
    .action-btn-sub   { font-size: 17px; margin-top: 4px; opacity: .95; }

    /* ── Form ── */
    .form-group { margin-bottom: 18px; }
    .form-label { font-size: 19px; font-weight: 600; color: var(--text); margin-bottom: 8px; display: block; }
    .form-input {
      width: 100%; padding: 14px 15px; border-radius: var(--r-sm);
      border: 1.5px solid var(--border); font-size: 17px; color: var(--text);
      background: var(--surface); outline: none; font-family: inherit; transition: border-color .2s;
      min-height: 52px;
    }
    .form-input:focus { border-color: var(--primary); }
    .form-textarea { resize: none; height: 100px; min-height: unset; }

    /* ── Chips ── */
    .chip-group { display: flex; flex-wrap: wrap; gap: 8px; }
    .chip {
      padding: 10px 16px; border-radius: 20px;
      border: 1.5px solid var(--border); background: var(--surface);
      font-size: 17px; color: var(--text); cursor: pointer; transition: all .2s; font-family: inherit;
      min-height: 48px; display: inline-flex; align-items: center;
    }
    .chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }

    /* ── Checkboxes ── */
    .check-item {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 15px 16px; margin-bottom: 10px;
      background: var(--surface); border-radius: var(--r-sm);
      border: 1.5px solid var(--border); cursor: pointer; transition: all .2s;
    }
    .check-item.on { border-color: var(--primary); background: var(--primary-bg); }
    .checkbox {
      width: 26px; height: 26px; border-radius: 7px; border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 2px;
      transition: all .2s;
    }
    .check-item.on .checkbox { background: var(--primary); border-color: var(--primary); }

    /* ── Progress ── */
    .progress-bar { height: 5px; background: var(--border); border-radius: 3px; margin-top: 10px; }
    .progress-fill { height: 100%; border-radius: 3px; background: var(--primary); transition: width .3s; }

    /* ── Timeline / Records ── */
    .tl-item { display: flex; gap: 12px; margin-bottom: 18px; position: relative; }
    .tl-item::before { content:''; position: absolute; left: 20px; top: 42px; bottom: -18px; width: 2px; background: var(--border); }
    .tl-item:last-child::before { display: none; }
    .tl-dot { width: 42px; height: 42px; border-radius: 50%; background: var(--primary-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 20px; }
    .tl-date  { font-size: 17px; color: var(--text-sub); font-weight: 600; }
    .tl-title { font-size: 19px; font-weight: 700; color: var(--text); margin: 3px 0; }
    .tl-body  { font-size: 17px; color: var(--text); line-height: 1.7; }

    /* ── Family list row (home, compact) ── */
    .family-row {
      display: flex; align-items: flex-start; gap: 14px;
      padding: 16px;
      background: var(--surface); border-radius: var(--r);
      border: 1px solid var(--border); margin-bottom: 10px;
      cursor: pointer; transition: border-color .2s, box-shadow .2s;
      box-shadow: var(--shadow);
    }
    .family-row:active { border-color: var(--primary); box-shadow: var(--shadow-md); }
    .family-emoji { font-size: 28px; width: 44px; text-align: center; flex-shrink: 0; padding-top: 2px; }
    .family-name  { font-size: 21px; font-weight: 800; color: var(--text); }
    .family-meta  { display: flex; flex-direction: column; gap: 9px; margin-top: 10px; }
    .family-meta-row { display: flex; align-items: center; gap: 6px; font-size: 17px; color: var(--text); flex-wrap: nowrap; line-height: 1.5; }
    .family-meta-label { color: var(--text-sub); font-weight: 700; white-space: nowrap; }
    .badge {
      font-size: 15px; font-weight: 700; padding: 5px 12px; border-radius: 20px;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .badge-warn  { background: var(--accent-light); color: var(--accent); }
    .badge-ok    { background: var(--green-light);  color: var(--green);  }
    .badge-gray  { background: var(--bg);           color: var(--text-sub); }
    .badge-due   { background: #FFF3CD; color: #9A6700; }

    /* ── Record card (timeline) ── */
    .rec-card {
      background: var(--surface); border-radius: var(--r);
      border: 1px solid var(--border); box-shadow: var(--shadow);
      padding: 16px; margin-bottom: 12px;
    }
    .rec-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 10px; }
    .rec-card-date   { font-size: 18px; font-weight: 700; color: var(--primary-dark); }
    .rec-card-person { font-size: 17px; color: var(--text-sub); margin-top: 3px; }
    .rec-card-row    { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; font-size: 17px; }
    .rec-card-lbl    { color: var(--text-sub); font-size: 16px; min-width: 72px; flex-shrink: 0; font-weight: 700; }
    .rec-card-val    { color: var(--text); font-weight: 600; line-height: 1.6; }
    .rec-card-memo   { font-size: 17px; color: var(--text); line-height: 1.75; margin-top: 8px; padding-top: 8px; border-top: 1px solid var(--border); }

    /* ── Tabs ── */
    .tab-bar {
      display: flex; border-bottom: 2px solid var(--border);
      margin-bottom: 14px; flex-shrink: 0;
    }
    .tab-btn {
      flex: 1; padding: 12px 6px; border: none; background: none;
      font-size: 17px; font-weight: 700; color: var(--text-sub);
      cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;
      font-family: inherit; transition: all .2s;
    }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* ── Memo block ── */
    .memo-block {
      background: var(--surface);
      border-left: 3px solid var(--primary);
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
      padding: 14px 16px; margin-bottom: 10px;
      box-shadow: var(--shadow);
    }
    .memo-block-date  { font-size: 16px; color: var(--text-sub); margin-bottom: 5px; font-weight: 600; }
    .memo-block-title { font-size: 19px; font-weight: 700; color: var(--text); margin-bottom: 5px; }
    .memo-block-body  { font-size: 17px; color: var(--text); line-height: 1.7; }

    /* ── Alert ── */
    .alert { padding: 14px 16px; border-radius: var(--r-sm); margin-bottom: 12px; display: flex; gap: 10px; align-items: flex-start; }
    .alert-info    { background: var(--primary-bg); }
    .alert-warn    { background: var(--accent-light); }
    .alert-success { background: var(--green-light); }

    /* ── Section title ── */
    .section-title { font-size: 16px; font-weight: 700; color: var(--text-sub); letter-spacing: .5px; margin: 16px 0 8px; }

    /* ── Step number ── */
    .step-num { width: 30px; height: 30px; border-radius: 50%; background: var(--primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 700; flex-shrink: 0; }

    /* ── Contact ── */
    .contact-item {
      display: flex; align-items: center; gap: 14px;
      padding: 14px 16px; background: var(--surface); border-radius: var(--r-sm);
      margin-bottom: 10px; border: 1px solid var(--border);
    }
    .contact-icon { width: 46px; height: 46px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .contact-name { font-size: 19px; font-weight: 700; color: var(--text); }
    .contact-tel  { font-size: 17px; color: var(--primary-dark); margin-top: 3px; }

    /* ── Report ── */
    .report-h3 { font-size: 16px; font-weight: 700; color: var(--primary-dark); margin-bottom: 10px; padding-bottom: 6px; border-bottom: 2px solid var(--primary-bg); }
    .report-row { display: flex; justify-content: space-between; padding: 9px 0; border-bottom: 1px solid var(--border); font-size: 16px; }
    .report-row:last-child { border-bottom: none; }

    /* ── Segment ── */
    .segment { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
    .seg-btn { flex: 1; padding: 10px 6px; border: none; background: none; font-size: 17px; color: var(--text-sub); cursor: pointer; border-radius: 8px; font-family: inherit; font-weight: 600; transition: all .2s; min-height: 48px; }
    .seg-btn.active { background: var(--surface); color: var(--primary); font-weight: 700; box-shadow: var(--shadow); }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 40px 20px; color: var(--text); font-size: 19px; line-height: 1.7; }
    .empty-icon { font-size: 48px; margin-bottom: 14px; }

    /* ── Animations ── */
    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .anim { animation: fadeUp .28s ease forwards; }
    @keyframes fadeInOut { 0%{opacity:0;transform:scale(.9)} 15%{opacity:1;transform:scale(1)} 75%{opacity:1} 100%{opacity:0} }

    /* ── Divider ── */
    .divider { height: 1px; background: var(--border); margin: 14px 0; }

    /* ── Print / PDF ── */
    #print-area { display: none; }
    @media print {
      body { background: white !important; margin: 0; padding: 0; }
      #root { display: none !important; }
      #print-area {
        display: block !important;
        font-family: -apple-system, 'Hiragino Sans', sans-serif;
        font-size: 12px; color: #1E2D3A; line-height: 1.7;
        padding: 20mm 18mm; box-sizing: border-box;
      }
      #print-area h1 { font-size: 20px; font-weight: 800; margin: 0 0 4px; }
      #print-area h2 { font-size: 14px; font-weight: 700; color: #2E6E82; margin: 16px 0 6px; padding-bottom: 4px; border-bottom: 2px solid #EAF5F8; }
      #print-area p  { margin: 2px 0; }
      #print-area table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
      #print-area td { padding: 5px 8px; border-bottom: 1px solid #DDE8ED; font-size: 12px; }
      #print-area td:first-child { color: #3D5166; width: 36%; }
      #print-area .p-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #DDE8ED; }
      #print-area .p-warn { font-weight: 700; color: #E8924A; }
      #print-area .p-sub  { font-size: 11px; color: #3D5166; }
      #print-area .p-note { margin-top: 16px; padding: 10px 12px; background: #EAF5F8; border-radius: 6px; font-size: 11px; color: #2E6E82; }
      #print-area .p-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
      #print-area .p-appname { font-size: 11px; color: #3D5166; }
      #print-area .p-consult-list { break-inside: avoid; page-break-inside: avoid; }
    }

    /* ── Trend chart ── */
    .trend-chart { display: flex; align-items: flex-end; gap: 5px; height: 88px; padding: 0 2px; }
    .trend-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; }
    .trend-bar { width: 100%; background: var(--primary); border-radius: 4px 4px 0 0; min-height: 4px; transition: height .4s ease; }
    .trend-bar.warn { background: var(--accent); }
    .trend-bar-num { font-size: 15px; font-weight: 700; color: var(--text); }
    .trend-bar-mo  { font-size: 14px; color: var(--text-sub); white-space: nowrap; font-weight: 600; }
    .trend-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 7px 14px; border-radius: 20px; font-size: 17px; font-weight: 700;
    }
  </style>
</head>
<body>
<div id="print-area"></div>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

/* ── Storage ── */
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

/* シードバージョンが変わったら自動リセット */
const SEED_VERSION = 'v2026-monthly';
if (localStorage.getItem('mmn_seed_version') !== SEED_VERSION) {
  ['mmn_persons','mmn_records','mmn_checks'].forEach(k => localStorage.removeItem(k));
  localStorage.setItem('mmn_seed_version', SEED_VERSION);
}

/* ── SVG Icons ── */
const Ic = ({ n, s = 22, c = 'currentColor' }) => {

    pencil: <svg viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" width={s} height={s}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,

    gear:   <svg viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" width={s} height={s}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
    plus:   <svg viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.5" strokeLinecap="round" width={s} height={s}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
    left:   <svg viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" width={s} height={s}><polyline points="15,18 9,12 15,6"/></svg>,
    right:  <svg viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" width={s} height={s}><polyline points="9,18 15,12 9,6"/></svg>,

/* 指定年月のチェック日（日） を返す */
const getCheckDayNum = (checkDay, year, month) => {
  if (checkDay === '末') return new Date(year, month, 0).getDate();
  return Number(checkDay || '1');
};

/* 次回チェック予定日を返す */
const getNextCheckDate = person => {
  const today = new Date();
  const y = today.getFullYear(), m = today.getMonth(); /* m は 0-indexed */
  const thisYM = `${y}-${String(m+1).padStart(2,'0')}`;
  /* 今月がまだ未チェックの場合 → 今月のチェック日 */
  if (!person.lastCheckDate || !person.lastCheckDate.startsWith(thisYM)) {
    const d = getCheckDayNum(person.checkDay, y, m+1);
    return new Date(y, m, d);
  }
  /* 今月チェック済み → 来月のチェック日 */
  const ny = m === 11 ? y+1 : y, nm = m === 11 ? 0 : m+1;
  const d = getCheckDayNum(person.checkDay, ny, nm+1);
  return new Date(ny, nm, d);
};

/* 今月チェック済みかどうか */
const san = name => /[さちく]ん$|さん$/.test(name) ? name : name + 'さん';

const checkedThisMonth = person => {
  const today = new Date();
  const thisYM = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;
  return !!(person.lastCheckDate && person.lastCheckDate.startsWith(thisYM));
};

/* チェック時期か（今月未チェック かつ 今日 >= チェック日） */
const isCheckDue = person => {
  if (checkedThisMonth(person)) return false;
  const today = new Date();
  const checkDay = getCheckDayNum(person.checkDay, today.getFullYear(), today.getMonth()+1);
  return today.getDate() >= checkDay;
};

const getCheckDueText = person => {
  if (checkedThisMonth(person)) {
    const next = getNextCheckDate(person);
    return `今月のチェック済み・次回: ${next.getMonth()+1}月${next.getDate()}日`;
  }
  if (!person.lastCheckDate) return 'まだ生活変化チェックをしていません';
  if (isCheckDue(person)) return '今月のチェック時期です';
  const next = getNextCheckDate(person);
  return `次回チェック予定: ${next.getMonth()+1}月${next.getDate()}日`;
};

const fmtTargetPeriod = ym => {
  if (!ym) return '';
  const [y, m] = ym.split('-');

  return `${y}年${Number(m)}月1日〜${y}年${Number(m)}月${last}日`;
};

const getPersonStats = (person, records, checkHistory) => {
  const myRec  = records.filter(r => r.personId === person.id);
  const myCk   = checkHistory.filter(c => c.personId === person.id);
  const lastRec = [...myRec].sort((a,b) => b.date.localeCompare(a.date))[0];
  const lastCk  = [...myCk].sort((a,b)  => b.date.localeCompare(a.date))[0];
  let statusLabel = '記録なし', statusClass = 'badge-gray';
  if (lastCk) {
    if      (lastCk.level === 'high') { statusLabel = '要確認'; statusClass = 'badge-warn'; }
    else if (lastCk.level === 'mid')  { statusLabel = '変化あり'; statusClass = 'badge-warn'; }
    else                              { statusLabel = '安定';     statusClass = 'badge-ok';   }
  } else if (myRec.length > 0) {
    statusLabel = '記録あり'; statusClass = 'badge-ok';
  }
  return {
    recordCount:   myRec.length,
    checkCount:    myCk.length,
    lastRecordDate: lastRec?.date || null,
    statusLabel, statusClass,
  };
};

/* ═══════════════════════════════════════════════════
   TREND VIEW (生活変化の推移)
═══════════════════════════════════════════════════ */
function TrendView({ person, checkHistory }) {
  const myChecks = checkHistory
    .filter(c => c.personId === person.id)
    .sort((a,b) => a.date.localeCompare(b.date));

  if (myChecks.length === 0) return (
    <div className="empty">
      <div className="empty-icon">📊</div>
      <p style={{ fontSize:17, lineHeight:1.7 }}>
        生活変化チェックを実施すると<br/>ここに変化の推移が表示されます。
      </p>
    </div>
  );

  /* ─ 月別集計（targetMonth 優先、なければ date スライス） ─ */
  const monthMap = {};
  myChecks.forEach(c => {
    const m = c.targetMonth || c.date.slice(0,7);
    if (!monthMap[m]) monthMap[m] = { count:0, ids: new Set(), impression:'', note:'' };
    monthMap[m].count    = Math.max(monthMap[m].count, c.count || 0);
    (c.checkedIds||[]).forEach(id => monthMap[m].ids.add(id));
    if (c.impression) monthMap[m].impression = c.impression;
    if (c.note)       monthMap[m].note = c.note;
  });
  const months   = Object.keys(monthMap).sort().slice(-6);
  const maxCount = Math.max(...months.map(m => monthMap[m].count), 1);

  /* ─ 傾向判定（気になった項目数ベース） ─ */
  const getTrend = () => {
    if (months.length < 3) return null;
    const half   = Math.floor(months.length / 2);
    const recent = months.slice(-half).reduce((s,m) => s + monthMap[m].count, 0) / half;
    const older  = months.slice(0, half).reduce((s,m) => s + monthMap[m].count, 0) / half;
    if (recent > older * 1.25) return { label:'気になる項目が増えています',   color:'var(--accent)',   bg:'#FFF3CD', icon:'📋' };
    if (recent < older * 0.75) return { label:'気になる項目が減っています',   color:'var(--green)',    bg:'var(--green-light)', icon:'📋' };
    return                             { label:'気になる項目はほぼ同じです',   color:'var(--primary)', bg:'var(--primary-bg)', icon:'📋' };
  };
  const trend = getTrend();

  const fmtMo     = m => { const [,mo] = m.split('-'); return `${Number(mo)}月`; };
  const fmtMoFull = m => { const [y,mo] = m.split('-'); return `${y}年${Number(mo)}月`; };

  return (
    <>
      {/* ─ 傾向バッジ ─ */}
      {trend && (
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14 }}>
          <span style={{ fontSize:15, color:'var(--text-sub)' }}>直近の傾向</span>
          <span className="trend-badge" style={{ background:trend.bg, color:trend.color }}>
            {trend.icon} {trend.label}
          </span>
        </div>
      )}

      {/* ─ 月別バーチャート（気になった項目数） ─ */}
      <div className="card" style={{ marginBottom:12 }}>
        <div className="card-title">月別の気になった項目数</div>
        <div className="trend-chart">
          {months.map(m => {
            const cnt = monthMap[m].count;
            const pct = Math.round((cnt / maxCount) * 80);
            const warn = cnt >= 5;
            return (
              <div key={m} className="trend-col">
                <div className="trend-bar-num">{cnt}項目</div>
                <div className={`trend-bar${warn?' warn':''}`} style={{ height: Math.max(pct, 6) + 'px', width:'100%' }} />
                <div className="trend-bar-mo">{fmtMo(m)}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* ─ 月別テキスト詳細 ─ */}
      <div className="card" style={{ marginBottom:12 }}>
        <div className="card-title">月別の記録</div>
        {[...months].reverse().map((m, i) => {
          const cnt        = monthMap[m].count;
          const items      = [...monthMap[m].ids].map(id => CHECK_QS.find(q => q.id === id)?.text).filter(Boolean);
          const impression = monthMap[m].impression;
          const note       = monthMap[m].note;
          const impColor   = IMPRESSION_COLOR[impression] || 'var(--text-sub)';
          return (
            <div key={m} style={{ padding:'12px 0', borderBottom: i < months.length-1 ? '1px solid var(--border)' : 'none' }}>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:6 }}>
                <span style={{ fontSize:17, fontWeight:700, color:'var(--text)' }}>{fmtMoFull(m)}</span>
                <span style={{ fontSize:15, fontWeight:700, color:'var(--text-sub)' }}>
                  {cnt}項目
                </span>
              </div>
              {impression && (
                <div style={{ fontSize:16, fontWeight:700, color: impColor, marginBottom:6 }}>
                  全体的な印象：{impression}
                </div>
              )}
              {items.length > 0 && (
                <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginBottom: note ? 8 : 0 }}>
                  {items.map(t => (
                    <span key={t} style={{ fontSize:14, background:'var(--primary-bg)', color:'var(--primary)', padding:'4px 10px', borderRadius:12, fontWeight:500 }}>
                      {t}
                    </span>
                  ))}
                </div>
              )}
              {note && (
                <div style={{ fontSize:15, color:'var(--text-sub)', lineHeight:1.7,
                  background:'var(--bg)', borderRadius:8, padding:'10px 12px',
                  whiteSpace:'pre-wrap', wordBreak:'break-all' }}>
                  {note}
                </div>
              )}
            </div>
          );
        })}
      </div>
    </>
  );
}

/* ═══════════════════════════════════════════════════
   相談先メモタブ
═══════════════════════════════════════════════════ */
const CONSULT_TYPES = [
  { value:'doctor',   label:'かかりつけ医',         icon:'🏥' },
  { value:'hospital', label:'医療機関名',           icon:'🏨' },
  { value:'careman',  label:'担当ケアマネージャー（介護支援専門員）',   icon:'👩‍⚕️' },
  { value:'chiiki',   label:'地域包括支援センター', icon:'🏢' },
  { value:'houmon',   label:'訪問介護事業所',       icon:'🚗' },
  { value:'shisetsu', label:'施設名',               icon:'🏠' },
  { value:'other',    label:'その他相談先',         icon:'💬' },
];

function ConsultTab({ person, onUpdatePerson }) {
  const consultees = person.consultees || [];
  const [editId, setEditId] = useState(null);
  const [form,   setForm]   = useState({ type:'doctor', name:'', contact:'', memo:'' });

  const getIcon  = v => CONSULT_TYPES.find(t => t.value === v)?.icon  || '💬';
  const getLabel = v => CONSULT_TYPES.find(t => t.value === v)?.label || 'その他';

  const openNew  = () => { setForm({ type:'doctor', name:'', contact:'', memo:'' }); setEditId('new'); };
  const openEdit = c   => { setForm({ type:c.type, name:c.name, contact:c.contact||'', memo:c.memo||'' }); setEditId(c.id); };
  const closeForm = () => setEditId(null);

  const saveForm = () => {
    if (!form.name.trim()) return;
    const updated = editId === 'new'
      ? [...consultees, { id: Date.now(), ...form }]
      : consultees.map(c => c.id === editId ? { ...c, ...form } : c);
    onUpdatePerson({ ...person, consultees: updated });
    setEditId(null);
  };

  const del = id => {
    if (window.confirm('この相談先を削除しますか？'))
      onUpdatePerson({ ...person, consultees: consultees.filter(c => c.id !== id) });
  };

  return (
    <>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
        <div style={{ fontSize:16, color:'var(--text-sub)' }}>{san(person.name)}の相談先・連絡先</div>
        {editId === null && (
          <button className="btn btn-primary btn-sm" onClick={openNew}>
            <Ic n="plus" s={14} c="#fff" />相談先を追加
          </button>
        )}
      </div>

      {/* 入力フォーム */}
      {editId !== null && (
        <div className="card" style={{ border:'2px solid var(--primary)', marginBottom:14 }}>
          <div className="card-title">{editId === 'new' ? '相談先を追加' : '相談先を編集'}</div>
          <div className="form-group">
            <label className="form-label">種別</label>
            <select className="form-input" value={form.type}
              onChange={e => setForm(f => ({ ...f, type: e.target.value }))}>
              {CONSULT_TYPES.map(t => (
                <option key={t.value} value={t.value}>{t.icon} {t.label}</option>
              ))}
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">名称・担当者名 <span style={{ color:'var(--accent)' }}>*</span></label>
            <input className="form-input" value={form.name}
              placeholder="例: ○○内科クリニック、担当: ○○先生"
              onChange={e => setForm(f => ({ ...f, name: e.target.value }))} />
          </div>
          <div className="form-group">
            <label className="form-label">電話番号・連絡先</label>
            <input className="form-input" value={form.contact}
              placeholder="例: 03-0000-0000"
              onChange={e => setForm(f => ({ ...f, contact: e.target.value }))} />
          </div>
          <div className="form-group">
            <label className="form-label">メモ（次回受診日・相談内容など）</label>
            <textarea className="form-input" rows={3} value={form.memo}
              placeholder={'例: 次回受診日 7月15日\n担当: ○○先生\n高血圧の件で相談済み'}
              onChange={e => setForm(f => ({ ...f, memo: e.target.value }))}
              style={{ resize:'none', lineHeight:1.65 }} />
          </div>
          <div style={{ display:'flex', gap:10 }}>
            <button className="btn btn-outline" style={{ flex:1 }} onClick={closeForm}>キャンセル</button>
            <button className="btn btn-primary" style={{ flex:1 }} onClick={saveForm}
              disabled={!form.name.trim()}>
              {editId === 'new' ? '追加する' : '保存する'}
            </button>
          </div>
        </div>
      )}

      {/* 空状態 */}
      {consultees.length === 0 && editId === null && (
        <div className="empty" style={{ padding:'32px 0' }}>
          <div className="empty-icon">🏥</div>
          <p style={{ fontSize:17, color:'var(--text-sub)', lineHeight:1.7 }}>
            かかりつけ医やケアマネージャー（介護支援専門員）、<br/>地域包括支援センターなどを<br/>登録しておくと便利です。<br/><br/>「相談先を追加」から登録してください。
          </p>
        </div>
      )}

      {/* カード一覧 */}
      {consultees.map(c => (
        <div key={c.id} className="card" style={{ marginBottom:10, padding:'14px 14px 12px' }}>
          <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:8 }}>
            <div style={{ display:'flex', alignItems:'flex-start', gap:10, flex:1, minWidth:0 }}>
              <span style={{ fontSize:26, flexShrink:0, marginTop:1 }}>{getIcon(c.type)}</span>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:13, color:'var(--primary)', fontWeight:700, marginBottom:4, letterSpacing:'.02em' }}>
                  {getLabel(c.type)}
                </div>
                <div style={{ fontSize:17, fontWeight:700, color:'var(--text)', wordBreak:'break-all' }}>
                  {c.name}
                </div>
                {c.contact && (
                  <div style={{ fontSize:16, color:'var(--primary)', marginTop:6 }}>
                    📞 {c.contact}
                  </div>
                )}
                {c.memo && (
                  <div style={{ fontSize:15, color:'var(--text-sub)', marginTop:8, lineHeight:1.7,
                    whiteSpace:'pre-wrap', wordBreak:'break-all',
                    background:'var(--bg)', borderRadius:8, padding:'10px 12px' }}>
                    {c.memo}
                  </div>
                )}
              </div>
            </div>
            <div style={{ display:'flex', gap:2, flexShrink:0 }}>
              <button onClick={() => openEdit(c)}
                style={{ background:'none', border:'none', cursor:'pointer', padding:'6px 10px',
                  color:'var(--primary)', fontSize:15, fontWeight:600 }}>編集</button>
              <button onClick={() => del(c.id)}
                style={{ background:'none', border:'none', cursor:'pointer', padding:'4px 6px' }}>
                <Ic n="trash" s={15} c="var(--text-light)" />
              </button>
            </div>
          </div>
        </div>
      ))}
    </>
  );
}

function FamilyScreen({ person, records, checkHistory, onBack, onAddRecord, onEditRecord, onDeleteRecord, onUpdatePerson, onStartCheck }) {
  const [tab, setTab] = useState('records');
  const myRecords = [...records].filter(r => r.personId === person.id)
                                .sort((a,b) => (b.date+b.time).localeCompare(a.date+a.time));
  const catCounts = {};
  myRecords.forEach(r => r.cats.forEach(c => { catCounts[c] = (catCounts[c]||0)+1; }));

  /* 次回チェック予定日を計算 */
  const due          = isCheckDue(person);
  const nextCheckDate = getNextCheckDate(person);
  const nextCheckStr  = `${nextCheckDate.getMonth()+1}月${nextCheckDate.getDate()}日`;
  const lastCheckYM   = person.lastCheckDate ? person.lastCheckDate.slice(0,7) : null;

  return (
    <div className="page anim">
      <div className="page-header">
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <button onClick={onBack} style={{ background:'none', border:'none', cursor:'pointer' }}>
            <Ic n="left" s={24} c="var(--primary)" />
          </button>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <span style={{ fontSize:28 }}>{person.emoji}</span>
            <div>
              <h1>{person.name}（{person.relation}）</h1>
              <p>記録 {myRecords.length}件 · チェック {checkHistory.filter(c => c.personId === person.id).length}回</p>
              {due ? (
                <p style={{ color:'#B86000', fontWeight:700, fontSize:15, marginTop:3 }}>
                  🔔 今月の生活変化チェックの時期です
                </p>
              ) : checkedThisMonth(person) ? (
                <p style={{ color:'var(--green)', fontSize:15, marginTop:3, fontWeight:600 }}>
                  ✅ 今月のチェック済み・次回: {nextCheckStr}
                </p>
              ) : (
                <p style={{ color:'var(--text-sub)', fontSize:15, marginTop:3 }}>
                  {lastCheckYM
                    ? `前回: ${fmtTargetMonth(lastCheckYM)}・次回チェック予定: ${nextCheckStr}`
                    : 'まだ生活変化チェックをしていません'}
                </p>
              )}
            </div>
          </div>
        </div>
        <div className="tab-bar" style={{ marginTop:12, marginBottom:0, overflowX:'auto' }}>
          {[['records','最近の記録'],['trend','変化の推移'],['consult','相談先メモ']].map(([id,label]) => (
            <button key={id} className={`tab-btn ${tab===id?'active':''}`} onClick={() => setTab(id)}
              style={{ whiteSpace:'nowrap', flexShrink:0 }}>{label}</button>
          ))}
        </div>
      </div>

      <div className="page-body">
        {/* ─ Tab: records ─ */}
        {tab === 'records' && (
          <>
            {/* チェックボタン */}
            {due && (
              <div style={{
                display:'flex', alignItems:'flex-start', gap:8,
                background:'#FFFBEA', border:'1.5px solid #F5C842',
                borderRadius:12, padding:'11px 14px', marginBottom:10,
              }}>
                <span style={{ fontSize:22, flexShrink:0, marginTop:1 }}>⚠️</span>
                <div>
                  <div style={{ fontSize:17, fontWeight:800, color:'#5A3A00' }}>生活変化チェックの時期です</div>
                  <div style={{ fontSize:15, color:'#7A5A20', marginTop:3 }}>最近の様子を確認してみましょう</div>
                </div>
              </div>
            )}

            {/* チェック時期：チェックボタンが上 / 通常：記録追加が上 */}
            {due && (
              <button onClick={() => onStartCheck(person)} style={{
                width:'100%', display:'flex', alignItems:'center', justifyContent:'center', gap:8,
                marginBottom:10, padding:'15px', borderRadius:12,
                border:'none', cursor:'pointer', fontFamily:'inherit',
                background:'#F5C842', color:'#5A3A00',
                fontSize:18, fontWeight:800,
                boxShadow:'0 3px 10px rgba(245,200,66,.45)',
              }}>
                🔔 生活変化チェックをする
              </button>
            )}

            <button className="btn btn-green btn-full" style={{ marginBottom:10 }} onClick={() => onAddRecord(person.id)}>
              <Ic n="plus" s={16} c="#fff" />気づき記録を追加
            </button>

            {!due && (
              <button onClick={() => onStartCheck(person)} style={{
                width:'100%', display:'flex', alignItems:'center', justifyContent:'center', gap:8,
                marginBottom:14, padding:'13px', borderRadius:12,
                border:'1.5px solid var(--primary)', cursor:'pointer', fontFamily:'inherit',
                background:'var(--surface)', color:'var(--primary)',
                fontSize:17, fontWeight:700,
              }}>
                🔍 生活変化チェックをする
              </button>
            )}
            {myRecords.length === 0 && (
              <div className="empty"><div className="empty-icon">📭</div><p>まだ記録がありません</p></div>
            )}
            {myRecords.map(r => {
              const sc = SCENES.find(s => s.id === r.sceneId);
              const scLabel = sc ? `${sc.icon} ${sc.label}` : (r.place || null);
              const isCheck = !!r.fromCheck;
              return (
                <div key={r.id} className="memo-block" style={{ position:'relative' }}>
                  <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', marginBottom:2 }}>
                    <div className="memo-block-date" style={{ margin:0 }}>{fmtDateTime(r.date, r.time)}</div>
                    <div style={{ display:'flex', alignItems:'center', gap:2, flexShrink:0, marginLeft:6 }}>
                      {!isCheck && (
                        <button onClick={() => onEditRecord && onEditRecord(r)}
                          style={{ background:'none', border:'none', cursor:'pointer',
                            padding:'4px 8px', fontSize:15, color:'var(--primary)', fontWeight:600 }}>
                          ✏️
                        </button>
                      )}
                      <button onClick={() => onDeleteRecord && onDeleteRecord(r.id)}
                        style={{ background:'none', border:'none', cursor:'pointer', padding:'2px 4px' }}>
                        <Ic n="trash" s={14} c="var(--text-light)" />
                      </button>
                    </div>
                  </div>
                  {scLabel && (
                    <div style={{ fontSize:15, color:'var(--primary)', fontWeight:600, margin:'4px 0' }}>
                      {scLabel}
                    </div>
                  )}
                  {r.cats?.length > 0 && (
                    <div className="memo-block-title">{r.cats.map(c => (CAT_EMOJI[c]||'📌')+' '+c).join('　')}</div>
                  )}
                  {r.memo && <div className="memo-block-body">{r.memo}</div>}
                </div>
              );
            })}
          </>
        )}

        {/* ─ Tab: trend ─ */}
        {tab === 'trend' && (
          <TrendView person={person} checkHistory={checkHistory} />
        )}

        {/* ─ Tab: consult ─ */}
        {tab === 'consult' && (
          <ConsultTab person={person} onUpdatePerson={onUpdatePerson} />
        )}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   生活変化チェック（月1回振り返り方式）
═══════════════════════════════════════════════════ */
const IMPRESSIONS = ['良くなった','変わらない','少し気になる','心配になってきた'];
const IMPRESSION_COLOR = {
  '良くなった':       'var(--green)',
  '変わらない':       'var(--primary)',
  '少し気になる':     'var(--accent)',
  '心配になってきた': '#D9534F',
};

function CheckScreen({ persons, initialPerson, onBack, onSave }) {
  const [step,       setStep]       = useState(initialPerson ? 1 : 0);
  const [person,     setPerson]     = useState(initialPerson || null);
  const [ans,        setAns]        = useState({});
  const [impression, setImpression] = useState('');
  const [note,       setNote]       = useState('');

  const today     = new Date();
  const targetYM  = `${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,'0')}`;

  const toggle  = id => setAns(p => ({ ...p, [id]: !p[id] }));
  const checked = CHECK_QS.filter(q => ans[q.id]);

  const getResult = () => {
    const n = checked.length;
    if (n >= 5) return { level:'high', label:'複数の変化が見られます',   color:'#D9534F', bg:'#FEF0EB', icon:'🔴' };
    if (n >= 3) return { level:'mid',  label:'気になる変化があります',    color:'var(--accent)', bg:'var(--accent-light)', icon:'🟡' };
    if (n >= 1) return { level:'low',  label:'軽度の変化が見られます',    color:'var(--primary)', bg:'var(--primary-bg)', icon:'🔵' };
    return               { level:'ok',   label:'特に気になる変化はありません', color:'var(--green)', bg:'var(--green-light)', icon:'🟢' };
  };

  /* ── STEP 0: 家族選択 ── */
  if (step === 0) return (
    <div className="page anim">
      <div className="page-header">
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <button onClick={onBack} style={{ background:'none', border:'none', cursor:'pointer' }}>
            <Ic n="left" s={24} c="var(--primary)" />
          </button>
          <div><h1>生活変化チェック</h1><p>対象の家族を選んでください</p></div>
        </div>
      </div>
      <div className="page-body">
        <div className="alert alert-info" style={{ marginBottom:14 }}>
          <Ic n="info" s={15} c="var(--primary)" />
          <span style={{ fontSize:16, color:'var(--primary-dark)', lineHeight:1.65 }}>
            この1か月を振り返って、家族の様子や変化を記録します。月に1回実施しましょう。
          </span>
        </div>
        {persons.map(p => (
          <div key={p.id} className="family-row" onClick={() => { setPerson(p); setAns({}); setImpression(''); setNote(''); setStep(1); }}>
            <div className="family-emoji" style={{ fontSize:26 }}>{p.emoji}</div>
            <div style={{ flex:1 }}>
              <div className="family-name">{p.name}（{p.relation}）</div>
              <div className="family-sub">
                {checkedThisMonth(p)
                  ? `今月のチェック済み`
                  : p.lastCheckDate
                    ? `前回: ${fmtTargetMonth(p.lastCheckDate.slice(0,7))}`
                    : 'まだチェックしていません'}
              </div>
            </div>
            {isCheckDue(p) && <span className="badge badge-due" style={{ marginRight:6, flexShrink:0 }}>チェック時期</span>}
            <Ic n="right" s={18} c="var(--text-light)" />
          </div>
        ))}
      </div>
    </div>
  );

  /* ── STEP 1: 対象期間説明 + チェック項目 ── */
  if (step === 1) return (
    <div className="page anim">
      <div className="page-header">
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <button onClick={() => setStep(0)} style={{ background:'none', border:'none', cursor:'pointer' }}>
              <Ic n="left" s={24} c="var(--primary)" />
            </button>
            <div><h1>生活変化チェック</h1><p>{san(person.name)} · ステップ1/2</p></div>
          </div>
          <span style={{ fontSize:16, color:'var(--text-sub)', fontWeight:600 }}>
            {checked.length}項目
          </span>
        </div>
        <div className="progress-bar"><div className="progress-fill" style={{ width:'50%' }} /></div>
      </div>
      <div className="page-body">
        {/* 説明 + 対象期間 */}
        <div style={{ background:'var(--primary-bg)', borderRadius:12, padding:'14px 14px', marginBottom:14 }}>
          <div style={{ fontSize:17, fontWeight:700, color:'var(--primary-dark)', marginBottom:8 }}>
            この1か月を振り返って、以前と比べて気になった変化を選んでください。
          </div>
          <div style={{ fontSize:15, color:'var(--text-sub)', display:'flex', alignItems:'center', gap:6 }}>
            <span>📅</span>
            <span>対象期間：{fmtTargetPeriod(targetYM)}</span>
          </div>
        </div>

        <div style={{ fontSize:16, color:'var(--text-sub)', marginBottom:14 }}>
          以前と比べて変化があった項目にチェックを入れてください。（複数選択可）
        </div>

        {CHECK_QS.map(q => (
          <div key={q.id} className={`check-item ${ans[q.id] ? 'on' : ''}`} onClick={() => toggle(q.id)}>
            <div className="checkbox">
              {ans[q.id] && <svg viewBox="0 0 12 10" width="12" height="10"><polyline points="1,5 4.5,8.5 11,1" stroke="white" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>}
            </div>
            <label style={{ fontSize:17, color:'var(--text)', cursor:'pointer', lineHeight:1.55 }}>{q.text}</label>
          </div>
        ))}

        <div style={{ marginTop:16 }}>
          <button className="btn btn-primary btn-full" onClick={() => setStep(2)}>
            次へ：全体的な印象を入力
          </button>
        </div>
      </div>
    </div>
  );

  /* ── STEP 2: 全体的な印象 + 自由記述 ── */
  if (step === 2) return (
    <div className="page anim">
      <div className="page-header">
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <button onClick={() => setStep(1)} style={{ background:'none', border:'none', cursor:'pointer' }}>
            <Ic n="left" s={24} c="var(--primary)" />
          </button>
          <div><h1>生活変化チェック</h1><p>{san(person.name)} · ステップ2/2</p></div>
        </div>
        <div className="progress-bar"><div className="progress-fill" style={{ width:'85%' }} /></div>
      </div>
      <div className="page-body">
        {/* 全体的な印象 */}
        <div className="form-group">
          <label className="form-label" style={{ marginBottom:12 }}>
            この1か月の全体的な印象
          </label>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
            {IMPRESSIONS.map(imp => {
              const active = impression === imp;
              const c = IMPRESSION_COLOR[imp];
              return (
                <button key={imp} onClick={() => setImpression(active ? '' : imp)}
                  style={{ padding:'14px 8px', borderRadius:12,
                    border: `2px solid ${active ? c : 'var(--border)'}`,
                    background: active ? (imp === '良くなった' ? 'var(--green-light)' : imp === '変わらない' ? 'var(--primary-bg)' : imp === '少し気になる' ? 'var(--accent-light)' : '#FEF0EB') : 'var(--surface)',
                    color: active ? c : 'var(--text-sub)',
                    fontWeight: active ? 700 : 500, fontSize:16,
                    cursor:'pointer', fontFamily:'inherit', lineHeight:1.4, textAlign:'center' }}>
                  {imp === '良くなった' ? '😊' : imp === '変わらない' ? '😐' : imp === '少し気になる' ? '😟' : '😨'}<br/>
                  {imp}
                </button>
              );
            })}
          </div>
        </div>

        {/* 自由記述 */}
        <div className="form-group">
          <label className="form-label">
            この1か月を振り返って感じたこと・様子の変化
            <span style={{ fontWeight:400, fontSize:15, color:'var(--text-light)', marginLeft:6 }}>（任意）</span>
          </label>
          <textarea
            className="form-input" rows={5}
            style={{ resize:'none', lineHeight:1.65 }}
            value={note}
            onChange={e => setNote(e.target.value)}
            placeholder={"例：\n・最近、食欲が落ちてきたように感じる\n・以前より同じ話を繰り返すことが増えた\n・今月は大きな変化はなかった"}
          />
        </div>

        <button className="btn btn-primary btn-full" onClick={() => setStep(3)}>
          確認する
        </button>
      </div>
    </div>
  );

  /* ── STEP 3: 確認・保存 ── */
  const res = getResult();
  return (
    <div className="page anim">
      <div className="page-header">
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <button onClick={() => setStep(2)} style={{ background:'none', border:'none', cursor:'pointer' }}>
            <Ic n="left" s={24} c="var(--primary)" />
          </button>
          <h1>チェック確認</h1>
        </div>
        <div className="progress-bar"><div className="progress-fill" style={{ width:'100%' }} /></div>
      </div>
      <div className="page-body">

        {/* 対象者・期間 */}
        <div style={{ background:'var(--bg)', borderRadius:12, padding:'12px 14px', marginBottom:14 }}>
          <div style={{ fontSize:16, color:'var(--text-sub)', marginBottom:6 }}>
            {person.emoji} {san(person.name)}
          </div>
          <div style={{ fontSize:15, color:'var(--text-sub)' }}>
            対象期間：{fmtTargetPeriod(targetYM)}
          </div>
        </div>

        {/* 結果バッジ */}
        <div style={{ background:res.bg, border:`2px solid ${res.color}30`, borderRadius:14, padding:'16px', textAlign:'center', marginBottom:14 }}>
          <div style={{ fontSize:32, marginBottom:6 }}>{res.icon}</div>
          <div style={{ fontSize:18, fontWeight:800, color:res.color }}>{res.label}</div>
          {checked.length > 0 && (
            <div style={{ fontSize:16, color:'var(--text-sub)', marginTop:8 }}>
              {checked.length}項目の変化が記録されました
            </div>
          )}
        </div>

        {/* 選択した項目 */}
        {checked.length > 0 && (
          <div className="card" style={{ marginBottom:12 }}>
            <div className="card-title">選択した項目</div>
            {checked.map(q => (
              <div key={q.id} style={{ padding:'8px 0', borderBottom:'1px solid var(--border)', fontSize:17, color:'var(--text)' }}>
                ☑ {q.text}
              </div>
            ))}
          </div>
        )}

        {/* 全体的な印象 */}
        {impression && (
          <div className="card" style={{ marginBottom:12 }}>
            <div className="card-title">全体的な印象</div>
            <div style={{ fontSize:17, fontWeight:700, color: IMPRESSION_COLOR[impression] || 'var(--text)' }}>
              {impression}
            </div>
          </div>
        )}

        {/* 自由記述 */}
        {note && (
          <div className="card" style={{ marginBottom:12 }}>
            <div className="card-title">この1か月を振り返って感じたこと</div>
            <div style={{ fontSize:16, color:'var(--text)', lineHeight:1.7, whiteSpace:'pre-wrap' }}>{note}</div>
          </div>
        )}

        {/* 次のステップ */}
        {checked.length >= 3 && (
          <div className="card" style={{ marginBottom:12 }}>
            <div className="card-title">次のステップ</div>
            {[
              { text:'家族内で情報を共有する',       icon:'👨‍👩‍👧' },
              { text:'地域包括支援センターへ相談',   icon:'🏢' },
              { text:'かかりつけ医への受診を検討',   icon:'🏥' },
            ].filter((_,i) => i < Math.min(checked.length, 3)).map((s,i) => (
              <div key={i} style={{ display:'flex', alignItems:'center', gap:12, padding:'8px 0', borderBottom:'1px solid var(--border)' }}>
                <span className="step-num">{i+1}</span>
                <span style={{ fontSize:17, color:'var(--text)', fontWeight:500 }}>{s.icon} {s.text}</span>
              </div>
            ))}
          </div>
        )}

        <div style={{ display:'flex', gap:10, marginTop:8 }}>
          <button className="btn btn-outline" style={{ flex:1 }} onClick={onBack}>
            キャンセル
          </button>
          <button className="btn btn-primary" style={{ flex:1 }}
            onClick={() => onSave({ person, ans, res, checked, impression, note, targetYM })}>
            記録に保存
          </button>
        </div>
      </div>
    </div>
  );
}

/* 実行時に参照するデータ（fetch成功時はJSONで上書き） */
let HINT_MASTER = FALLBACK_HINTS;
/* fetch状態を React に伝えるためのコールバック（App側でセット） */
let _onHintMasterUpdated = null;

/* input-examples.json を非同期で取得し HINT_MASTER を更新する */
fetch('./input-examples.json')
  .then(r => { if (!r.ok) throw new Error('fetch failed'); return r.json(); })
  .then(data => {
    HINT_MASTER = data.map(jsonEntryToInternal);
    if (_onHintMasterUpdated) _onHintMasterUpdated();
  })
  .catch(() => {
    /* 読み込み失敗 → フォールバックのまま継続 */
    if (_onHintMasterUpdated) _onHintMasterUpdated('error');
  });

/*
  入力例を取得する関数
  ─ cats が空 → null（入力例セクション非表示）
  ─ 共通（type:'共通'）は常に先に表示
  ─ 場面別（type:'場面別'）は sceneId が一致したときのみ追加表示
*/
const getHints = (cats, sceneId) => {
  if (!cats || cats.length === 0) return null; /* null = セクション非表示 */
  const seen  = new Set();
  const hints = [];
  const push  = text => { if (!seen.has(text)) { seen.add(text); hints.push(text); } };
  cats.forEach(cat => {
    /* ① 共通入力例 */
    HINT_MASTER.filter(h => h.category === cat && h.type === '共通' && h.scene === '_').forEach(h => push(h.text));
    /* ② 場面別入力例（場面が選択されているとき追加） */
    if (sceneId) {
      HINT_MASTER.filter(h => h.category === cat && h.type === '場面別' && h.scene === sceneId).forEach(h => push(h.text));
    }
  });
  return hints.length === 0 ? [] : hints; /* [] = "自由に入力してください" */
};

function RecordForm({ persons, initialPersonId, onBack, onSave, initial = null }) {
  const today = new Date().toISOString().split('T')[0];
  const now   = new Date().toTimeString().slice(0,5);
  const [date,      setDate]      = useState(initial?.date     || today);
  const [time,      setTime]      = useState(initial?.time     || now);
  const [personId,  setPersonId]  = useState(initial?.personId || initialPersonId || persons[0]?.id || 1);
  const [cats,      setCats]      = useState(initial?.cats     || []);
  const [memo,      setMemo]      = useState(initial?.memo     || '');
  const [sceneId,   setSceneId]   = useState(initial?.sceneId  || '');
  const [otherText, setOtherText] = useState(initial?.place    || '');

  const scene = SCENES.find(s => s.id === sceneId);
  const toggleCat = c => setCats(p => p.includes(c) ? p.filter(x=>x!==c) : [...p,c]);

  const memoRef = React.useRef(null);
  const [hintToast, setHintToast] = useState(false);
  const addHint = h => {
    setMemo(prev => {
      const lines = prev ? prev.split('\n') : [];
      if (lines.includes(h)) return prev; /* 重複追加しない */
      return prev ? prev + '\n' + h : h;
    });
    setHintToast(true);
    setTimeout(() => setHintToast(false), 1800);
    setTimeout(() => memoRef.current?.scrollIntoView({ behavior:'smooth', block:'center' }), 50);
  };

  const handleSave = () => {
    if (!memo && cats.length === 0) { alert('「気になったこと」か「詳細メモ」を入力してください'); return; }
    const place = sceneId === 'other' ? (otherText || 'その他') : (scene?.label || '');
    onSave({ id: initial?.id || Date.now(), date, time, personId: Number(personId), cats, memo, place, sceneId });
  };

  return (
    <div className="page anim">
      <div className="page-header">
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <button onClick={onBack} style={{ background:'none', border:'none', cursor:'pointer' }}>
              <Ic n="x" s={22} c="var(--text-sub)" />
            </button>
            <h1>{initial ? '記録を編集' : '気づき記録を追加'}</h1>
          </div>
          <button className="btn btn-green btn-sm" onClick={handleSave}>保存</button>
        </div>
      </div>
      <div className="page-body">

        {/* ─ 対象の家族 ─ */}
        <div className="form-group">
          <label className="form-label">対象の家族</label>
          <select className="form-input" value={personId} onChange={e => setPersonId(e.target.value)}>
            {persons.map(p => <option key={p.id} value={p.id}>{p.emoji} {p.name}（{p.relation}）</option>)}
          </select>
        </div>

        {/* ─ 日付・時刻 ─ */}
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          <div className="form-group">
            <label className="form-label">日付</label>
            <input type="date" className="form-input" value={date} onChange={e => setDate(e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">時刻</label>
            <input type="time" className="form-input" value={time} onChange={e => setTime(e.target.value)} />
          </div>
        </div>

        {/* ─ 気になったこと ─ */}
        <div className="form-group">
          <label className="form-label">気になったこと <span style={{ fontSize:14, color:'var(--text-sub)', fontWeight:400 }}>（複数選択可）</span></label>
          <div className="chip-group">
            {CATS.map(c => <button key={c} className={`chip ${cats.includes(c)?'on':''}`} onClick={() => toggleCat(c)}>{c}</button>)}
          </div>
        </div>

        {/* ─ 気づいた場面 ─ */}
        <div className="form-group">
          <label className="form-label">気づいた場面</label>
          <div style={{ position:'relative' }}>
            <select className="form-input"
              value={sceneId}
              onChange={e => { setSceneId(e.target.value); setOtherText(''); }}
              style={{ paddingLeft:14, appearance:'none', WebkitAppearance:'none' }}>
              <option value="">選択してください</option>
              {SCENES.map(s => <option key={s.id} value={s.id}>{s.icon} {s.label}</option>)}
            </select>
            <span style={{ position:'absolute', right:14, top:'50%', transform:'translateY(-50%)', fontSize:15, color:'var(--text-sub)', pointerEvents:'none' }}>▼</span>
          </div>

          {sceneId === 'other' && (
            <input type="text" className="form-input" style={{ marginTop:8 }}
              value={otherText} onChange={e => setOtherText(e.target.value)}
              placeholder="場所や場面を入力してください" autoFocus />
          )}

          {/* 入力例ヒント（気になったこと×気づいた場面）*/}
          {(() => {
            const hints = getHints(cats, sceneId);
            if (hints === null) return null; /* カテゴリ未選択 → 非表示 */
            const sceneObj = SCENES.find(s => s.id === sceneId);
            /* ラベル */
            let hintLabel = '';
            if (cats.length === 1 && sceneObj) {
              hintLabel = `${cats[0]} × ${sceneObj.icon}${sceneObj.label} の入力例`;
            } else if (cats.length === 1) {
              hintLabel = `${cats[0]} の入力例`;
            } else if (cats.length > 1 && sceneObj) {
              hintLabel = `${sceneObj.icon}${sceneObj.label} での入力例`;
            } else {
              hintLabel = '入力例';
            }
            return (
              <div style={{ marginTop:10, background:'var(--primary-bg)', borderRadius:10, padding:'10px 14px' }}>
                <div style={{ fontSize:14, fontWeight:700, color:'var(--primary-dark)', marginBottom:8 }}>
                  {hintLabel}（タップで詳細メモに追加）
                </div>
                {hints.length === 0 ? (
                  <div style={{ fontSize:16, color:'var(--text)', padding:'4px 0' }}>
                    入力例はありません。詳細メモに自由に入力してください。
                  </div>
                ) : (
                  hints.map(h => (
                    <button key={h}
                      onClick={() => addHint(h)}
                      style={{
                        display:'flex', alignItems:'center', gap:8, width:'100%',
                        background:'none', border:'none', cursor:'pointer',
                        padding:'8px 0', textAlign:'left', fontFamily:'inherit',
                        borderBottom:'1px solid rgba(74,144,164,.12)',
                      }}>
                      <span style={{ fontSize:18, color:'var(--primary)', flexShrink:0, fontWeight:700 }}>＋</span>
                      <span style={{ fontSize:15, color:'var(--text)', lineHeight:1.55 }}>{h}</span>
                    </button>
                  ))
                )}
              </div>
            );
          })()}
        </div>

        {/* ─ 詳細メモ ─ */}
        <div className="form-group" style={{ position:'relative' }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:4 }}>
            <label className="form-label" style={{ marginBottom:0 }}>詳細メモ</label>
            {hintToast && (
              <span style={{
                fontSize:15, fontWeight:700, color:'var(--green)',
                background:'var(--green-light)', padding:'3px 10px', borderRadius:20,
                animation:'fadeInOut 1.8s ease forwards',
              }}>
                ✓ 詳細メモに追加しました
              </span>
            )}
          </div>
          <textarea ref={memoRef} className="form-input" style={{ resize:'none', height:96 }}
            value={memo} onChange={e => setMemo(e.target.value)}
            placeholder="気づいたこと、会話の内容など自由に記録できます&#10;（上の入力例をタップすると自動入力されます）" />
        </div>

        {/* ─ 写真 ─ */}
        <div className="form-group">
          <label className="form-label">写真 <span style={{ fontSize:14, color:'var(--text-sub)', fontWeight:400 }}>（任意）</span></label>
          <div style={{ width:72, height:72, background:'var(--bg)', borderRadius:10, display:'flex', alignItems:'center', justifyContent:'center', border:'2px dashed var(--border)', cursor:'pointer' }}>
            <Ic n="camera" s={24} c="var(--text-light)" />
          </div>
          <div style={{ fontSize:14, color:'var(--text-sub)', marginTop:6 }}>※ β版では写真保存はデモ表示のみです</div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════

function RecordsScreen({ persons, records, checkHistory, onAddRecord, onDeleteRecord, onEditRecord, initialPersonId }) {
  const [tab, setTab] = useState('list'); /* 'list' | 'trend' */
  const [filterPerson, setFilterPerson] = useState(
    initialPersonId != null ? String(initialPersonId) : 'all'
  );
  const [seg, setSeg] = useState('all');

  /* initialPersonId が変わったら同期 */
  React.useEffect(() => {
    if (initialPersonId != null) setFilterPerson(String(initialPersonId));
  }, [initialPersonId]);

  const sorted   = [...records].sort((a,b) => (b.date+b.time).localeCompare(a.date+a.time));
  const filtered = sorted.filter(r => {
    if (filterPerson !== 'all' && r.personId !== Number(filterPerson)) return false;
    if (seg === 'check' && !r.fromCheck) return false;
    if (seg === 'memo'  &&  r.fromCheck) return false;
    return true;
  });

  /* 月別グループ → 日付別グループ に変換 */
  const monthGroups = [];
  filtered.forEach(r => {
    const mo = r.date.slice(0, 7);
    const dy = r.date;
    let mg = monthGroups.find(g => g.month === mo);
    if (!mg) { mg = { month: mo, days: [] }; monthGroups.push(mg); }
    let dg = mg.days.find(d => d.date === dy);
    if (!dg) { dg = { date: dy, items: [] }; mg.days.push(dg); }
    dg.items.push(r);
  });

  const fmtMonthHead = mo => {
    const [y, m] = mo.split('-');
    return `${y}年${Number(m)}月`;
  };

  /* 変化の推移タブ用：選択中の家族オブジェクト */
  const trendPerson = filterPerson !== 'all'
    ? persons.find(p => p.id === Number(filterPerson))
    : null;

  return (
    <div className="page anim">
      <div className="page-header">
        {/* タイトル行 */}
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
          <div><h1>記録</h1><p>記録一覧・変化の推移</p></div>
          {tab === 'list' && (
            <button className="btn btn-green btn-sm" onClick={() => onAddRecord(filterPerson !== 'all' ? Number(filterPerson) : null)} style={{ gap:4 }}>
              <Ic n="plus" s={14} c="#fff" />追加
            </button>
          )}
        </div>

        {/* 家族セレクター */}
        <select className="form-input" style={{ marginBottom:10 }}
          value={filterPerson} onChange={e => { setFilterPerson(e.target.value); }}>
          <option value="all">すべての家族</option>
          {persons.map(p => <option key={p.id} value={p.id}>{p.emoji} {p.name}</option>)}
        </select>

        {/* 記録一覧 | 変化の推移 タブ */}
        <div className="tab-bar" style={{ marginBottom:0 }}>
          <button className={`tab-btn ${tab==='list'?'active':''}`} onClick={() => setTab('list')}>📝 記録一覧</button>
          <button className={`tab-btn ${tab==='trend'?'active':''}`} onClick={() => setTab('trend')}>📊 変化の推移</button>
        </div>
      </div>

      <div className="page-body">

        {/* ══ 変化の推移タブ ══ */}
        {tab === 'trend' && (
          trendPerson
            ? <TrendView person={trendPerson} checkHistory={checkHistory} />
            : (
              <div className="empty">
                <div className="empty-icon">📊</div>
                <p style={{ fontSize:17, lineHeight:1.7 }}>
                  上の家族セレクターから<br/>表示したい家族を選んでください。
                </p>
              </div>
            )
        )}

        {/* ══ 記録一覧タブ ══ */}
        {tab === 'list' && (
          <>
            {/* 種別フィルター */}
            <div className="segment" style={{ marginBottom:14 }}>
              <button className={`seg-btn ${seg==='all'  ?'active':''}`} onClick={() => setSeg('all')}>すべて</button>
              <button className={`seg-btn ${seg==='memo' ?'active':''}`} onClick={() => setSeg('memo')}>気づき記録</button>
              <button className={`seg-btn ${seg==='check'?'active':''}`} onClick={() => setSeg('check')}>チェック結果</button>
            </div>

            {filtered.length === 0 && (
