/* ── SettingsScreen 家族カード（展開式） ── */
function PersonCard({ person, onUpdate, onDelete }) {
  const EMOJIS = ['👨','👩','👴','👵','🧑','👦','👧'];
  const PRESET_TIMES = ['07:00','09:00','12:00','18:00','20:00','22:00'];
  const [open, setOpen] = useState(false);
  const [editName, setEditName] = useState(person.name);
  const [editRel,  setEditRel]  = useState(person.relation);
  const [editEmoji, setEditEmoji] = useState(person.emoji);

  const saveBasic = () => {
    if (!editName) return;
    onUpdate({ ...person, name: editName, relation: editRel, emoji: editEmoji });
  };

  const interval = person.checkInterval || '毎月';
  const notify   = person.notifyTime    || '';
  const due      = isCheckDue(person);

  let nextDateStr = null;
  if (person.lastCheckDate && CHECK_INTERVAL_DAYS[interval]) {
    const d = new Date(person.lastCheckDate);
    d.setDate(d.getDate() + CHECK_INTERVAL_DAYS[interval]);
    nextDateStr = d.toLocaleDateString('ja-JP');
  }

  return (
    <div className="card" style={{ padding:0, overflow:'hidden', marginBottom:10 }}>
      {/* ヘッダー行 */}
      <div
        onClick={() => setOpen(o => !o)}
        style={{ display:'flex', alignItems:'center', padding:'13px 14px', cursor:'pointer', gap:12 }}>
        <div style={{ fontSize:26, flexShrink:0 }}>{person.emoji}</div>
        <div style={{ flex:1 }}>
          <div style={{ fontWeight:700, fontSize:15, color:'var(--text)' }}>{person.name}（{person.relation}）</div>
          <div style={{ fontSize:12, color:'var(--text-sub)', marginTop:2 }}>
            チェック: {interval}
            {due && <span style={{ color:'var(--accent)', fontWeight:700, marginLeft:8 }}>🔔 時期です</span>}
          </div>
        </div>
        <button onClick={e => { e.stopPropagation(); onDelete(person.id); }}
          style={{ background:'none', border:'none', cursor:'pointer', padding:'4px 6px', marginRight:4 }}>
          <Ic n="trash" s={16} c="var(--text-light)" />
        </button>
        <span style={{ fontSize:12, color:'var(--text-light)', transition:'transform .2s', display:'inline-block', transform: open ? 'rotate(90deg)' : 'rotate(0deg)' }}>▶</span>
      </div>

      {open && (
        <div style={{ borderTop:'1px solid var(--border)', padding:'14px 14px 16px' }}>
          {/* ── 基本情報編集 ── */}
          <div style={{ fontSize:13, fontWeight:700, color:'var(--text-sub)', marginBottom:10, textTransform:'uppercase', letterSpacing:'.04em' }}>基本情報</div>
          <div className="form-group">
            <label className="form-label">名前</label>
            <input className="form-input" value={editName} onChange={e => setEditName(e.target.value)} onBlur={saveBasic} />
          </div>
          <div className="form-group">
            <label className="form-label">続柄</label>
            <input className="form-input" value={editRel} onChange={e => setEditRel(e.target.value)} onBlur={saveBasic} placeholder="父、母、祖母など" />
          </div>
          <div className="form-group">
            <label className="form-label">アイコン</label>
            <div style={{ display:'flex', gap:8, flexWrap:'wrap' }}>
              {EMOJIS.map(em => (
                <button key={em} onClick={() => { setEditEmoji(em); onUpdate({ ...person, emoji: em, name: editName, relation: editRel }); }}
                  style={{ width:40, height:40, fontSize:22, background: editEmoji===em ? 'var(--primary-bg)' : 'var(--bg)', border: editEmoji===em ? '2px solid var(--primary)' : '2px solid transparent', borderRadius:10, cursor:'pointer' }}>
                  {em}
                </button>
              ))}
            </div>
          </div>

          {/* ── チェック設定 ── */}
          <div style={{ fontSize:13, fontWeight:700, color:'var(--text-sub)', margin:'16px 0 10px', textTransform:'uppercase', letterSpacing:'.04em' }}>チェック設定</div>

          {/* 前回 / 次回 */}
          <div style={{ background:'var(--bg)', borderRadius:10, padding:'10px 12px', marginBottom:12 }}>
            <div style={{ display:'flex', justifyContent:'space-between', padding:'5px 0', borderBottom:'1px solid var(--border)' }}>
              <span style={{ fontSize:13, color:'var(--text-sub)' }}>前回チェック日</span>
              <span style={{ fontSize:13, fontWeight:700 }}>{person.lastCheckDate ? fmtDateSlash(person.lastCheckDate) : '未実施'}</span>
            </div>
            <div style={{ display:'flex', justifyContent:'space-between', padding:'5px 0' }}>
              <span style={{ fontSize:13, color:'var(--text-sub)' }}>次回チェック目安</span>
              <span style={{ fontSize:13, fontWeight:700, color: due ? 'var(--accent)' : 'var(--text)' }}>
                {nextDateStr || '─'}{due && nextDateStr && ' ⚠'}
              </span>
            </div>
          </div>

          {/* チェック間隔 */}
          <label className="form-label">チェック間隔</label>
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:8, marginBottom:12 }}>
            {['毎週','2週間ごと','毎月','設定しない'].map(opt => {
              const active = interval === opt;
              return (
                <button key={opt} onClick={() => onUpdate({ ...person, checkInterval: opt })}
                  style={{ padding:'10px 6px', borderRadius:10, border:`2px solid ${active?'var(--primary)':'var(--border)'}`, background: active?'var(--primary-bg)':'var(--surface)', color: active?'var(--primary)':'var(--text-sub)', fontWeight: active?700:500, fontSize:13, cursor:'pointer', fontFamily:'inherit', display:'flex', flexDirection:'column', alignItems:'center', gap:3 }}>
                  <span style={{ fontSize:16 }}>{opt==='毎週'?'📅':opt==='2週間ごと'?'🗓':opt==='毎月'?'📆':'🔕'}</span>
                  {opt}
                </button>
              );
            })}
          </div>

          {/* 通知時間 */}
          <label className="form-label">通知時間（アプリ内表示）</label>
          <div style={{ display:'flex', flexWrap:'wrap', gap:6, marginBottom:10 }}>
            {PRESET_TIMES.map(t => {
              const active = notify === t;
              return (
                <button key={t} onClick={() => onUpdate({ ...person, notifyTime: active ? '' : t })}
                  style={{ padding:'6px 12px', borderRadius:20, border:`1.5px solid ${active?'var(--primary)':'var(--border)'}`, background: active?'var(--primary)':'var(--surface)', color: active?'#fff':'var(--text)', fontSize:13, fontWeight: active?700:400, cursor:'pointer', fontFamily:'inherit' }}>
                  {t}
                </button>
              );
            })}
          </div>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <span style={{ fontSize:13, color:'var(--text-sub)', flexShrink:0 }}>時刻指定</span>
            <input type="time" className="form-input" style={{ flex:1 }} value={notify}
              onChange={e => onUpdate({ ...person, notifyTime: e.target.value })} />
            {notify && (
              <button onClick={() => onUpdate({ ...person, notifyTime: '' })}
                style={{ background:'none', border:'none', cursor:'pointer', color:'var(--text-light)', flexShrink:0 }}>✕</button>
            )}
          </div>
        </div>
      )}
    </div>
  );
}

function SettingsScreen({ persons, records, checkHistory, onAddPerson, onUpdatePerson, onDeletePerson, onRestore }) {
  const EMOJIS = ['👨','👩','👴','👵','🧑','👦','👧'];
  const [showAdd, setShowAdd] = useState(false);
  const [name,  setName]  = useState('');
  const [rel,   setRel]   = useState('');
  const [emoji, setEmoji] = useState('👨');
  const [checkInterval, setCheckInterval] = useState('毎月');

  const handleAdd = () => {
    if (!name) return;
    onAddPerson({ id: Date.now(), name, relation: rel, emoji, checkInterval, lastCheckDate: null });
    setShowAdd(false); setName(''); setRel(''); setEmoji('👨'); setCheckInterval('毎月');
  };

  return (
    <div className="page anim">
      <div className="page-header"><h1>設定</h1><p>家族情報・アプリ設定</p></div>
      <div className="page-body">
        <div className="card" style={{ background:'var(--primary-bg)', border:'none', boxShadow:'none' }}>
          <div style={{ fontSize:13, color:'var(--primary-dark)', lineHeight:1.7 }}>
            <b>実家見守りノートについて</b><br/>
            家族の生活変化や気になった出来事を記録し、医師・ケアマネジャー・地域包括支援センターなどへ相談するときに役立てるための記録アプリです。データはこのデバイスにのみ保存されます。
          </div>
        </div>

        {/* ── 家族管理 ── */}
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', margin:'16px 0 10px' }}>
          <div className="section-title" style={{ margin:0 }}>家族管理</div>
          <button className="btn btn-primary btn-sm" onClick={() => setShowAdd(o => !o)}>
            <Ic n="plus" s={14} c="#fff" />{showAdd ? 'キャンセル' : '追加'}
          </button>
        </div>

        {showAdd && (
          <div className="card" style={{ border:'2px solid var(--primary)', marginBottom:12 }}>
            <div className="card-title">新しい家族を追加</div>
            <div className="form-group">
              <label className="form-label">名前</label>
              <input className="form-input" value={name} onChange={e => setName(e.target.value)} placeholder="例：お父さん" />
            </div>
            <div className="form-group">
              <label className="form-label">続柄</label>
              <input className="form-input" value={rel} onChange={e => setRel(e.target.value)} placeholder="例：父、母、祖父など" />
            </div>
            <div className="form-group">
              <label className="form-label">アイコン</label>
              <div style={{ display:'flex', gap:8 }}>
                {EMOJIS.map(em => (
                  <button key={em} onClick={() => setEmoji(em)} style={{ width:40, height:40, fontSize:22, background: emoji===em ? 'var(--primary-bg)' : 'var(--bg)', border: emoji===em ? '2px solid var(--primary)' : '2px solid transparent', borderRadius:10, cursor:'pointer' }}>{em}</button>
                ))}
              </div>
            </div>
            <div className="form-group">
              <label className="form-label">生活変化チェックの間隔</label>
              <select className="form-input" value={checkInterval} onChange={e => setCheckInterval(e.target.value)}>
                {['毎週','2週間ごと','毎月','設定しない'].map(f => <option key={f} value={f}>{f}</option>)}
              </select>
            </div>
            <div style={{ display:'flex', gap:10 }}>
              <button className="btn btn-outline" style={{ flex:1 }} onClick={() => setShowAdd(false)}>キャンセル</button>
              <button className="btn btn-primary" style={{ flex:1 }} onClick={handleAdd} disabled={!name}>追加する</button>
            </div>
          </div>
        )}

        {persons.map(p => (
          <PersonCard key={p.id} person={p} onUpdate={onUpdatePerson} onDelete={onDeletePerson} />
        ))}

        {/* ── バックアップ ── */}
        <div className="section-title" style={{ marginTop:20 }}>バックアップ</div>
        <div className="card">
          <div style={{ fontSize:13, color:'var(--text-sub)', lineHeight:1.65, marginBottom:14 }}>
            家族情報・気づき記録・生活変化チェック・相談先メモをJSONファイルに保存・復元できます。端末内のみで動作します。
          </div>

          {/* 書き出し */}
          <button
            onClick={() => {
              const data = {
                version: 1,
                exportedAt: new Date().toISOString(),
                persons,
                records,
                checkHistory,
              };
              const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
              const url  = URL.createObjectURL(blob);
              const a    = document.createElement('a');
              a.href     = url;
              a.download = `mikamori-backup-${new Date().toISOString().slice(0,10)}.json`;
              a.click();
              URL.revokeObjectURL(url);
            }}
            style={{
              width:'100%', display:'flex', alignItems:'center', justifyContent:'center', gap:8,
              padding:'13px', borderRadius:12, marginBottom:10,
              border:'1.5px solid var(--primary)', background:'var(--primary-bg)',
              color:'var(--primary)', fontSize:14, fontWeight:700, cursor:'pointer', fontFamily:'inherit',
            }}>
            💾 バックアップを作成する
          </button>

          {/* 復元 */}
          <label style={{
            width:'100%', display:'flex', alignItems:'center', justifyContent:'center', gap:8,
            padding:'13px', borderRadius:12, boxSizing:'border-box',
            border:'1.5px solid var(--border)', background:'var(--surface)',
            color:'var(--text)', fontSize:14, fontWeight:700, cursor:'pointer',
          }}>
            📂 バックアップから復元する
            <input type="file" accept=".json,application/json" style={{ display:'none' }}
              onChange={e => {
                const file = e.target.files?.[0];
                if (!file) return;
                const reader = new FileReader();
                reader.onload = ev => {
                  try {
                    const data = JSON.parse(ev.target.result);
                    if (!data.persons && !data.records && !data.checkHistory) {
                      alert('このファイルは実家見守りノートのバックアップファイルではありません。');
                      return;
                    }
                    if (window.confirm(`バックアップを復元しますか？\n\n家族: ${data.persons?.length||0}人\n記録: ${data.records?.length||0}件\nチェック: ${data.checkHistory?.length||0}件\n\n現在のデータは上書きされます。`)) {
                      onRestore(data);
                      alert('復元が完了しました。');
                    }
                  } catch {
                    alert('ファイルの読み込みに失敗しました。正しいJSONファイルを選択してください。');
                  }
                };
                reader.readAsText(file);
                e.target.value = '';
              }}
            />
          </label>
        </div>

        <div className="section-title" style={{ marginTop:20 }}>アプリ情報</div>
        <div className="card">
          {[
            { label:'データ保存場所', value:'このデバイスのみ' },
            { label:'バージョン',     value:'β 1.0.0' },
            { label:'プライバシー',   value:'データは外部送信されません' },
          ].map(i => (
            <div key={i.label} style={{ display:'flex', justifyContent:'space-between', alignItems:'center', padding:'11px 0', borderBottom:'1px solid var(--border)' }}>
              <span style={{ fontSize:14, color:'var(--text)' }}>{i.label}</span>
              <span style={{ fontSize:12, color:'var(--text-sub)' }}>{i.value}</span>
            </div>
          ))}
          <div style={{ padding:'12px 0' }}>
            <button
              onClick={() => {
                if (window.confirm('全データをサンプルデータにリセットしますか？\n現在のデータは削除されます。')) {
                  ['mmn_persons','mmn_records','mmn_checks'].forEach(k => localStorage.removeItem(k));
                  localStorage.setItem('mmn_seed_version', SEED_VERSION);
                  window.location.reload();
                }
              }}
              style={{ width:'100%', padding:'10px', borderRadius:10, border:'1.5px solid var(--border)', background:'var(--bg)', color:'var(--text-sub)', fontSize:13, cursor:'pointer', fontFamily:'inherit' }}>
              🔄 サンプルデータでリセット
            </button>
          </div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   ROOT APP
═══════════════════════════════════════════════════ */
function App() {
  const [persons,      setPersons]      = useState(() => load('mmn_persons',  SEED_PERSONS));
  const [records,      setRecords]      = useState(() => load('mmn_records',  SEED_RECORDS));
  const [checkHistory, setCheckHistory] = useState(() => load('mmn_checks',   SEED_CHECKS));
  const [screen,      setScreen]      = useState('home');
  const [modal,       setModal]       = useState(null);
  const [checkTarget, setCheckTarget] = useState(null); /* 家族詳細からチェックを直接開始する対象 */
  const [deleteConfirmId, setDeleteConfirmId] = useState(null); /* 削除確認ダイアログ */

  useEffect(() => { save('mmn_persons',  persons);      }, [persons]);
  useEffect(() => { save('mmn_records',  records);      }, [records]);
  useEffect(() => { save('mmn_checks',   checkHistory); }, [checkHistory]);

  const handleNav = s => {
    if (s.startsWith('family_')) { setScreen(s); return; }
    setScreen(s);
  };

  const saveRecord = rec => {
    setRecords(prev => {
      const exists = prev.find(r => r.id === rec.id);
      return exists ? prev.map(r => r.id === rec.id ? rec : r) : [rec, ...prev];
    });
    setModal(null);
    setScreen('records');
  };

  const deleteRecord = id => setDeleteConfirmId(id);
  const confirmDeleteRecord = () => {
    setRecords(p => p.filter(r => r.id !== deleteConfirmId));
    setDeleteConfirmId(null);
  };

  const saveCheck = ({ person, ans, res, checked }) => {
    const today = new Date().toISOString().split('T')[0];
    const now   = new Date().toTimeString().slice(0,5);
    /* 記録として保存 */
    const rec = {
      id: Date.now(),
      date: today, time: now,
      personId: person.id,
      cats: checked.map(q => q.text),
      memo: `生活変化チェック実施。${res.label}（${checked.length}項目）`,
      place: '', fromCheck: true,
    };
    setRecords(p => [rec, ...p]);
    /* チェック履歴として保存 */
    const hist = {
      id: Date.now() + 1,
      personId: person.id,
      date: today,
      checkedIds: Object.entries(ans).filter(([,v]) => v).map(([k]) => k),
      count: checked.length,
      level: res.level,
    };
    setCheckHistory(p => [hist, ...p]);
    /* 家族の lastCheckDate を更新 */
    setPersons(prev => prev.map(p => p.id === person.id ? { ...p, lastCheckDate: today } : p));
    setScreen('home');
  };

  const addPerson    = p   => setPersons(prev => [...prev, p]);
  const updatePerson = p   => setPersons(prev => prev.map(x => x.id === p.id ? p : x));
  const deletePerson = id => {
    if (window.confirm('この家族を削除しますか？')) setPersons(p => p.filter(x => x.id !== id));
  };

  const NAV = [
    { id:'home',    label:'ホーム',   icon:'home'   },
    { id:'records', label:'記録',     icon:'pencil' },
    { id:'report',  label:'相談メモ', icon:'file'   },
    { id:'settings',label:'設定',     icon:'gear'   },
  ];

  const showNav = modal === null && !screen.startsWith('family_') && screen !== 'check';

  /* ─ modal: record form ─ */
  if (modal) {
    const initPid = modal.personId || null;
    return (
      <>
        <RecordForm
          persons={persons}
          initialPersonId={initPid}
          initial={modal.initialRecord || null}
          onBack={() => setModal(null)}
          onSave={saveRecord}
        />
      </>
    );
  }

  /* ─ family detail ─ */
  if (screen.startsWith('family_')) {
    const pid    = Number(screen.split('_')[1]);
    const person = persons.find(p => p.id === pid);
    if (!person) { setScreen('home'); return null; }
    return (
      <>
        <FamilyScreen
          person={person} records={records} checkHistory={checkHistory}
          onBack={() => setScreen('home')}
          onAddRecord={personId => setModal({ personId })}
          onEditRecord={r => setModal({ personId: r.personId, initialRecord: r })}
          onDeleteRecord={deleteRecord}
          onUpdatePerson={updatePerson}
          onStartCheck={p => { setCheckTarget(p); setScreen('check'); }}
        />
      </>
    );
  }

  /* ─ named screens ─ */
  const renderScreen = () => {
    switch (screen) {
      case 'home':
        return <HomeScreen persons={persons} records={records} checkHistory={checkHistory} onNav={handleNav} onRecordAdd={() => setModal({ personId: null })} />;
      case 'check':
        return <CheckScreen persons={persons} initialPerson={checkTarget}
                  onBack={() => { setCheckTarget(null); setScreen('home'); }}
                  onSave={(...args) => { setCheckTarget(null); saveCheck(...args); }} />;
      case 'records':
        return <RecordsScreen persons={persons} records={records} onAddRecord={pid => setModal({ personId: pid })} onDeleteRecord={deleteRecord} onEditRecord={r => setModal({ personId: r.personId, initialRecord: r })} />;
      case 'report':
        return <ReportScreen persons={persons} records={records} checkHistory={checkHistory} />;
      case 'settings':
        return <SettingsScreen
          persons={persons} records={records} checkHistory={checkHistory}
          onAddPerson={addPerson} onUpdatePerson={updatePerson} onDeletePerson={deletePerson}
          onRestore={(data) => {
            if (data.persons)      { setPersons(data.persons);           save('mmn_persons', data.persons); }
            if (data.records)      { setRecords(data.records);           save('mmn_records', data.records); }
            if (data.checkHistory) { setCheckHistory(data.checkHistory); save('mmn_checks',  data.checkHistory); }
          }}
        />;
      default:
        return null;
    }
  };

  return (
    <>
      {renderScreen()}
      {showNav && (
        <nav className="bottom-nav">
          {NAV.map(item => (
            <button key={item.id} className={`nav-btn ${screen===item.id?'active':''}`} onClick={() => setScreen(item.id)}>
              <Ic n={item.icon} s={22} c={screen===item.id ? 'var(--primary)' : 'var(--text-light)'} />
              <span>{item.label}</span>
            </button>
          ))}
        </nav>
      )}

      {/* ─ 削除確認ダイアログ ─ */}
      {deleteConfirmId !== null && (
        <div style={{
          position:'fixed', inset:0, background:'rgba(0,0,0,0.45)',
          display:'flex', alignItems:'center', justifyContent:'center',
          zIndex:9999, padding:'0 24px',
        }}>
          <div style={{
            background:'var(--surface)', borderRadius:16, padding:'28px 24px 20px',
            width:'100%', maxWidth:340, boxShadow:'0 8px 32px rgba(0,0,0,0.18)',
          }}>
            <div style={{ fontSize:18, fontWeight:800, color:'var(--text)', marginBottom:10, textAlign:'center' }}>
              🗑️ 記録を削除
            </div>
            <div style={{ fontSize:14, color:'var(--text-sub)', lineHeight:1.7, textAlign:'center', marginBottom:24 }}>
              この記録を削除しますか？<br/>
              <span style={{ fontSize:12, color:'var(--text-light)' }}>削除したデータは元に戻せません。</span>
            </div>
            <div style={{ display:'flex', gap:10 }}>
              <button
                onClick={() => setDeleteConfirmId(null)}
                style={{
                  flex:1, padding:'12px 0', borderRadius:10, border:'1.5px solid var(--border)',
                  background:'var(--bg)', color:'var(--text)', fontSize:15, fontWeight:600,
                  cursor:'pointer', fontFamily:'inherit',
                }}>
                キャンセル
              </button>
              <button
                onClick={confirmDeleteRecord}
                style={{
                  flex:1, padding:'12px 0', borderRadius:10, border:'none',
                  background:'#D9534F', color:'#fff', fontSize:15, fontWeight:700,
                  cursor:'pointer', fontFamily:'inherit',
                }}>
                削除する
              </button>
            </div>
          </div>
        </div>
      )}
    </>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
