<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>実家見守りノート</title>
  <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    :root {
      --primary:       #4A90A4;
      --primary-light: #6EB5C8;
      --primary-dark:  #2E6E82;
      --primary-bg:    #EAF5F8;
      --green:         #5FAA8C;
      --green-light:   #E6F4EF;
      --accent:        #E8924A;
      --accent-light:  #FDF1E6;
      --bg:            #F6F8F9;
      --surface:       #FFFFFF;
      --text:          #1E2D3A;
      --text-sub:      #6B7F8E;
      --text-light:    #A8B8C4;
      --border:        #DDE8ED;
      --shadow:        0 2px 10px rgba(74,144,164,0.09);
      --shadow-md:     0 4px 18px rgba(74,144,164,0.14);
      --r:             16px;
      --r-sm:          10px;
      --nav-h:         68px;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Hiragino Sans', 'Hiragino Kaku Gothic ProN', 'Yu Gothic', sans-serif;
      background: #B8D4DC;
      display: flex; justify-content: center; align-items: center; min-height: 100vh;
    }
    #root {
      width: 390px; height: 844px;
      background: var(--bg);
      position: relative; overflow: hidden;
      border-radius: 42px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.28);
    }
    @media (max-width: 430px) {
      body { background: var(--bg); align-items: flex-start; }
      #root { width: 100vw; height: 100dvh; border-radius: 0; box-shadow: none; }
    }

    /* ── Layout ── */
    .page { position: absolute; inset: 0; display: flex; flex-direction: column; overflow: hidden; }
    .page-header {
      padding: 52px 20px 14px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }
    .page-header h1 { font-size: 18px; font-weight: 800; color: var(--text); }
    .page-header p  { font-size: 13px; color: var(--text-sub); margin-top: 2px; }
    .page-body {
      flex: 1; overflow-y: auto; padding: 16px;
      padding-bottom: calc(var(--nav-h) + 16px);
    }
    .page-body::-webkit-scrollbar { display: none; }

    /* ── Bottom Nav ── */
    .bottom-nav {
      position: absolute; bottom: 0; left: 0; right: 0;
      height: var(--nav-h);
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex; align-items: center;
      padding: 0 4px 8px; z-index: 100;
    }
    .nav-btn {
      flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
      padding: 8px 4px; border: none; background: none; cursor: pointer;
      color: var(--text-light); font-size: 10px; transition: color .2s;
    }
    .nav-btn.active { color: var(--primary); }

    /* ── Cards ── */
    .card { background: var(--surface); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); margin-bottom: 12px; }
    .card-title { font-size: 13px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: .4px; margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 6px;
      border: none; cursor: pointer; transition: all .18s; font-family: inherit;
      border-radius: 50px;
    }
    .btn-full { width: 100%; }
    .btn-primary { background: var(--primary); color: #fff; padding: 14px 20px; font-size: 15px; font-weight: 700; }
    .btn-primary:active { background: var(--primary-dark); transform: scale(.98); }
    .btn-green  { background: var(--green);   color: #fff; padding: 14px 20px; font-size: 15px; font-weight: 700; }
    .btn-orange { background: var(--accent);  color: #fff; padding: 14px 20px; font-size: 15px; font-weight: 700; }
    .btn-ghost  { background: var(--primary-bg); color: var(--primary); padding: 14px 20px; font-size: 15px; font-weight: 700; }
    .btn-outline{ background: #fff; color: var(--primary); border: 2px solid var(--primary); padding: 12px 20px; font-size: 14px; font-weight: 700; }
    .btn-sm     { padding: 8px 14px; font-size: 13px; border-radius: 20px; }
    .btn-icon   { background: var(--primary-bg); color: var(--primary); width: 36px; height: 36px; border-radius: 50%; padding: 0; }

    /* ── Big action buttons (home) ── */
    .action-btn {
      display: flex; align-items: center; gap: 14px;
      padding: 18px 20px; border-radius: var(--r);
      border: none; cursor: pointer; transition: transform .15s, box-shadow .15s;
      text-align: left; width: 100%; font-family: inherit; margin-bottom: 10px;
      box-shadow: var(--shadow);
    }
    .action-btn:active { transform: scale(.98); box-shadow: var(--shadow-md); }
    .action-btn-icon { width: 48px; height: 48px; border-radius: 14px; display: flex; align-items: center; justify-content: center; font-size: 22px; flex-shrink: 0; }
    .action-btn-label { font-size: 15px; font-weight: 700; }
    .action-btn-sub   { font-size: 12px; margin-top: 2px; opacity: .8; }

    /* ── Form ── */
    .form-group { margin-bottom: 14px; }
    .form-label { font-size: 13px; font-weight: 600; color: var(--text); margin-bottom: 6px; display: block; }
    .form-input {
      width: 100%; padding: 11px 13px; border-radius: var(--r-sm);
      border: 1.5px solid var(--border); font-size: 15px; color: var(--text);
      background: var(--surface); outline: none; font-family: inherit; transition: border-color .2s;
    }
    .form-input:focus { border-color: var(--primary); }
    .form-textarea { resize: none; height: 84px; }

    /* ── Chips ── */
    .chip-group { display: flex; flex-wrap: wrap; gap: 7px; }
    .chip {
      padding: 7px 13px; border-radius: 20px;
      border: 1.5px solid var(--border); background: var(--surface);
      font-size: 13px; color: var(--text); cursor: pointer; transition: all .2s; font-family: inherit;
    }
    .chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }

    /* ── Checkboxes ── */
    .check-item {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 13px 15px; margin-bottom: 8px;
      background: var(--surface); border-radius: var(--r-sm);
      border: 1.5px solid var(--border); cursor: pointer; transition: all .2s;
    }
    .check-item.on { border-color: var(--primary); background: var(--primary-bg); }
    .checkbox {
      width: 22px; height: 22px; border-radius: 6px; border: 2px solid var(--border);
      display: flex; align-items: center; justify-content: center; flex-shrink: 0; margin-top: 1px;
      transition: all .2s;
    }
    .check-item.on .checkbox { background: var(--primary); border-color: var(--primary); }

    /* ── Progress ── */
    .progress-bar { height: 4px; background: var(--border); border-radius: 2px; margin-top: 10px; }
    .progress-fill { height: 100%; border-radius: 2px; background: var(--primary); transition: width .3s; }

    /* ── Timeline / Records ── */
    .tl-item { display: flex; gap: 12px; margin-bottom: 16px; position: relative; }
    .tl-item::before { content:''; position: absolute; left: 19px; top: 38px; bottom: -16px; width: 2px; background: var(--border); }
    .tl-item:last-child::before { display: none; }
    .tl-dot { width: 40px; height: 40px; border-radius: 50%; background: var(--primary-bg); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 18px; }
    .tl-date  { font-size: 11px; color: var(--text-sub); }
    .tl-title { font-size: 14px; font-weight: 700; color: var(--text); margin: 2px 0; }
    .tl-body  { font-size: 13px; color: var(--text-sub); line-height: 1.55; }

    /* ── Family list row (home, compact) ── */
    .family-row {
      display: flex; align-items: flex-start; gap: 12px;
      padding: 14px 16px;
      background: var(--surface); border-radius: var(--r);
      border: 1px solid var(--border); margin-bottom: 10px;
      cursor: pointer; transition: border-color .2s, box-shadow .2s;
      box-shadow: var(--shadow);
    }
    .family-row:active { border-color: var(--primary); box-shadow: var(--shadow-md); }
    .family-emoji { font-size: 26px; width: 40px; text-align: center; flex-shrink: 0; padding-top: 2px; }
    .family-name  { font-size: 15px; font-weight: 800; color: var(--text); }
    .family-meta  { display: flex; flex-direction: column; gap: 3px; margin-top: 5px; }
    .family-meta-row { display: flex; align-items: center; gap: 4px; font-size: 12px; color: var(--text-sub); }
    .family-meta-label { color: var(--text-light); min-width: 52px; }
    .badge {
      font-size: 12px; font-weight: 700; padding: 4px 10px; border-radius: 20px;
      display: inline-flex; align-items: center; gap: 4px;
    }
    .badge-warn  { background: var(--accent-light); color: var(--accent); }
    .badge-ok    { background: var(--green-light);  color: var(--green);  }
    .badge-gray  { background: var(--bg);           color: var(--text-sub); }
    .badge-due   { background: #FFF3CD; color: #9A6700; }

    /* ── Record card (timeline) ── */
    .rec-card {
      background: var(--surface); border-radius: var(--r);
      border: 1px solid var(--border); box-shadow: var(--shadow);
      padding: 14px 16px; margin-bottom: 10px;
    }
    .rec-card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
    .rec-card-date   { font-size: 13px; font-weight: 700; color: var(--primary); }
    .rec-card-person { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
    .rec-card-row    { display: flex; align-items: baseline; gap: 6px; margin-bottom: 4px; font-size: 13px; }
    .rec-card-lbl    { color: var(--text-light); font-size: 11px; min-width: 72px; flex-shrink: 0; }
    .rec-card-val    { color: var(--text); font-weight: 600; line-height: 1.5; }
    .rec-card-memo   { font-size: 13px; color: var(--text-sub); line-height: 1.6; margin-top: 6px; padding-top: 6px; border-top: 1px solid var(--border); }

    /* ── Tabs ── */
    .tab-bar {
      display: flex; border-bottom: 2px solid var(--border);
      margin-bottom: 14px; flex-shrink: 0;
    }
    .tab-btn {
      flex: 1; padding: 10px 6px; border: none; background: none;
      font-size: 13px; font-weight: 600; color: var(--text-sub);
      cursor: pointer; border-bottom: 3px solid transparent; margin-bottom: -2px;
      font-family: inherit; transition: all .2s;
    }
    .tab-btn.active { color: var(--primary); border-bottom-color: var(--primary); }

    /* ── Memo block ── */
    .memo-block {
      background: var(--surface);
      border-left: 3px solid var(--primary);
      border-radius: 0 var(--r-sm) var(--r-sm) 0;
      padding: 12px 14px; margin-bottom: 10px;
      box-shadow: var(--shadow);
    }
    .memo-block-date  { font-size: 11px; color: var(--text-sub); margin-bottom: 4px; }
    .memo-block-title { font-size: 14px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
    .memo-block-body  { font-size: 13px; color: var(--text-sub); line-height: 1.6; }

    /* ── Alert ── */
    .alert { padding: 12px 14px; border-radius: var(--r-sm); margin-bottom: 12px; display: flex; gap: 10px; align-items: flex-start; }
    .alert-info    { background: var(--primary-bg); }
    .alert-warn    { background: var(--accent-light); }
    .alert-success { background: var(--green-light); }

    /* ── Section title ── */
    .section-title { font-size: 11px; font-weight: 700; color: var(--text-sub); text-transform: uppercase; letter-spacing: .5px; margin: 14px 0 8px; }

    /* ── Step number ── */
    .step-num { width: 26px; height: 26px; border-radius: 50%; background: var(--primary); color: #fff; display: inline-flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; flex-shrink: 0; }

    /* ── Contact ── */
    .contact-item {
      display: flex; align-items: center; gap: 12px;
      padding: 12px 14px; background: var(--surface); border-radius: var(--r-sm);
      margin-bottom: 8px; border: 1px solid var(--border);
    }
    .contact-icon { width: 42px; height: 42px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 20px; flex-shrink: 0; }
    .contact-name { font-size: 14px; font-weight: 700; color: var(--text); }
    .contact-tel  { font-size: 13px; color: var(--primary); margin-top: 2px; }

    /* ── Report ── */
    .report-h3 { font-size: 13px; font-weight: 700; color: var(--primary-dark); margin-bottom: 8px; padding-bottom: 5px; border-bottom: 2px solid var(--primary-bg); }
    .report-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--border); font-size: 13px; }
    .report-row:last-child { border-bottom: none; }

    /* ── Segment ── */
    .segment { display: flex; background: var(--bg); border-radius: 10px; padding: 3px; margin-bottom: 14px; }
    .seg-btn { flex: 1; padding: 8px; border: none; background: none; font-size: 13px; color: var(--text-sub); cursor: pointer; border-radius: 8px; font-family: inherit; font-weight: 500; transition: all .2s; }
    .seg-btn.active { background: var(--surface); color: var(--primary); font-weight: 700; box-shadow: var(--shadow); }

    /* ── Empty state ── */
    .empty { text-align: center; padding: 36px 20px; color: var(--text-sub); }
    .empty-icon { font-size: 44px; margin-bottom: 12px; }

    /* ── Animations ── */
    @keyframes fadeUp { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }
    .anim { animation: fadeUp .28s ease forwards; }
    @keyframes fadeInOut { 0%{opacity:0;transform:scale(.9)} 15%{opacity:1;transform:scale(1)} 75%{opacity:1} 100%{opacity:0} }

    /* ── Divider ── */
    .divider { height: 1px; background: var(--border); margin: 12px 0; }

    /* ── Print / PDF ── */
    #print-area { display: none; }
    @media print {
      body { background: white !important; margin: 0; padding: 0; }
      #root { display: none !important; }
      #print-area {
        display: block !important;
        font-family: -apple-system, 'Hiragino Sans', sans-serif;
        font-size: 12px; color: #1E2D3A; line-height: 1.7;
        padding: 20mm 18mm; box-sizing: border-box;
      }
      #print-area h1 { font-size: 20px; font-weight: 800; margin: 0 0 4px; }
      #print-area h2 { font-size: 14px; font-weight: 700; color: #2E6E82; margin: 16px 0 6px; padding-bottom: 4px; border-bottom: 2px solid #EAF5F8; }
      #print-area p  { margin: 2px 0; }
      #print-area table { width: 100%; border-collapse: collapse; margin-bottom: 12px; }
      #print-area td { padding: 5px 8px; border-bottom: 1px solid #DDE8ED; font-size: 12px; }
      #print-area td:first-child { color: #6B7F8E; width: 36%; }
      #print-area .p-row { display: flex; justify-content: space-between; padding: 5px 0; border-bottom: 1px solid #DDE8ED; }
      #print-area .p-warn { font-weight: 700; color: #E8924A; }
      #print-area .p-sub  { font-size: 11px; color: #6B7F8E; }
      #print-area .p-note { margin-top: 16px; padding: 10px 12px; background: #EAF5F8; border-radius: 6px; font-size: 11px; color: #2E6E82; }
      #print-area .p-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 12px; }
      #print-area .p-appname { font-size: 11px; color: #6B7F8E; }
      /* 相談先一覧：リスト全体を1ブロックとして扱い途中改ページ禁止。
         収まらない場合のみリスト直前で改ページ。個別アイテムには指定しない。 */
      #print-area .p-consult-list {
        break-inside: avoid;
        page-break-inside: avoid;
      }
    }

    /* ── Trend chart ── */
    .trend-chart { display: flex; align-items: flex-end; gap: 5px; height: 88px; padding: 0 2px; }
    .trend-col { flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px; height: 100%; justify-content: flex-end; }
    .trend-bar { width: 100%; background: var(--primary); border-radius: 4px 4px 0 0; min-height: 4px; transition: height .4s ease; }
    .trend-bar.warn { background: var(--accent); }
    .trend-bar-num { font-size: 11px; font-weight: 700; color: var(--text); }
    .trend-bar-mo  { font-size: 10px; color: var(--text-sub); white-space: nowrap; }
    .trend-badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 12px; border-radius: 20px; font-size: 13px; font-weight: 700;
    }
  </style>
</head>
<body>
<div id="print-area"></div>
<div id="root"></div>

<script type="text/babel">
const { useState, useEffect, useCallback } = React;

/* ── Storage ── */
const load = (k, d) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

/* シードバージョンが変わったら自動リセット */
const SEED_VERSION = 'v2025-sample';
if (localStorage.getItem('mmn_seed_version') !== SEED_VERSION) {
  ['mmn_persons','mmn_records','mmn_checks'].forEach(k => localStorage.removeItem(k));
  localStorage.setItem('mmn_seed_version', SEED_VERSION);
}

/* ── SVG Icons ── */
const Ic = ({ n, s = 22, c = 'currentColor' }) => {
  const d = {
    home:   <svg viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" width={s} height={s}><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9,22 9,12 15,12 15,22"/></svg>,
    pencil: <svg viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" width={s} height={s}><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>,

    file:   <svg viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" width={s} height={s}><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14,2 14,8 20,8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg>,
    gear:   <svg viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" width={s} height={s}><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>,
    plus:   <svg viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2.5" strokeLinecap="round" width={s} height={s}><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>,
    left:   <svg viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" width={s} height={s}><polyline points="15,18 9,12 15,6"/></svg>,
    right:  <svg viewBox="0 0 24 24" fill="none" stroke={c} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" width={s} height={s}><polyline points="9,18 15,12 9,6"/></svg>,

const STATUS_ICON = { '安定':'🟢', '変化あり':'🟡', '要確認':'🔴', 'チェック時期':'🔔', '記録あり':'🟢', '記録なし':'⚪' };
const statusWithIcon = label => `${STATUS_ICON[label]||'⚪'} ${label}`;

/* チェック間隔（日数） */
const CHECK_INTERVAL_DAYS = { '毎週':7, '2週間ごと':14, '毎月':30, '設定しない':null };

const getDaysSince = dateStr => {
  if (!dateStr) return null;
  return Math.floor((Date.now() - new Date(dateStr)) / 86400000);
};

const isCheckDue = person => {
  if (person.checkInterval === '設定しない' || !person.checkInterval) return false;
  const days      = getDaysSince(person.lastCheckDate);
  const threshold = CHECK_INTERVAL_DAYS[person.checkInterval];
  if (!threshold) return false;
  return days === null || days >= threshold;
};

const getCheckDueText = person => {
  if (person.checkInterval === '設定しない' || !person.checkInterval) return null;
  const days = getDaysSince(person.lastCheckDate);
  if (days === null) return 'まだチェックしていません';
  return `前回から${days}日経過`;
};

const getPersonStats = (person, records, checkHistory) => {
  const myRec  = records.filter(r => r.personId === person.id);
  const myCk   = checkHistory.filter(c => c.personId === person.id);
  const lastRec = [...myRec].sort((a,b) => b.date.localeCompare(a.date))[0];
  const lastCk  = [...myCk].sort((a,b)  => b.date.localeCompare(a.date))[0];
  let statusLabel = '記録なし', statusClass = 'badge-gray';
  if (lastCk) {
    if      (lastCk.level === 'high') { statusLabel = '要確認'; statusClass = 'badge-warn'; }
    else if (lastCk.level === 'mid')  { statusLabel = '変化あり'; statusClass = 'badge-warn'; }
    else                              { statusLabel = '安定';     statusClass = 'badge-ok';   }
  } else if (myRec.length > 0) {
    statusLabel = '記録あり'; statusClass = 'badge-ok';
  }
  return {
    recordCount:   myRec.length,
    checkCount:    myCk.length,
    lastRecordDate: lastRec?.date || null,
    statusLabel, statusClass,
  };
};

/* ═══════════════════════════════════════════════════
   TREND VIEW (生活変化の推移)
═══════════════════════════════════════════════════ */
function TrendView({ person, checkHistory }) {
  const myChecks = checkHistory
    .filter(c => c.personId === person.id)
    .sort((a,b) => a.date.localeCompare(b.date));

  if (myChecks.length === 0) return (
    <div className="empty">
      <div className="empty-icon">📊</div>
      <p style={{ fontSize:14, lineHeight:1.7 }}>
        生活変化チェックを実施すると<br/>ここに変化の推移が表示されます。
      </p>
    </div>
  );

  /* ─ 月別集計 ─ */
  const monthMap = {};
  myChecks.forEach(c => {
    const m = c.date.slice(0,7);
    if (!monthMap[m]) monthMap[m] = { sessions:0, count:0, ids: new Set() };
    monthMap[m].sessions += 1;          /* チェック実施回数 */
    monthMap[m].count    += c.count;    /* 項目数合計（詳細用） */
    c.checkedIds.forEach(id => monthMap[m].ids.add(id));
  });
  const months     = Object.keys(monthMap).sort().slice(-6);
  const maxSessions = Math.max(...months.map(m => monthMap[m].sessions), 1);

  /* ─ 項目別：何ヶ月で出現したか ─ */
  const itemMonths = {};
  myChecks.forEach(c => {
    const m = c.date.slice(0,7);
    c.checkedIds.forEach(id => {
      const q = CHECK_QS.find(q => q.id === id);
      if (!q) return;
      if (!itemMonths[q.text]) itemMonths[q.text] = new Set();
      itemMonths[q.text].add(m);
    });
  });

  /* ─ 傾向判定（実施回数ベース） ─ */
  const getTrend = () => {
    if (months.length < 3) return null;
    const half   = Math.floor(months.length / 2);
    const recent = months.slice(-half).reduce((s,m) => s + monthMap[m].sessions, 0) / half;
    const older  = months.slice(0, half).reduce((s,m) => s + monthMap[m].sessions, 0) / half;
    if (recent > older * 1.25) return { label:'確認頻度が増えています',     color:'var(--primary)', bg:'var(--primary-bg)', icon:'📋' };
    if (recent < older * 0.75) return { label:'確認頻度が減っています',     color:'var(--text-sub)', bg:'var(--bg)',          icon:'📋' };
    return                             { label:'確認頻度はほぼ同じです',     color:'var(--primary)', bg:'var(--primary-bg)', icon:'📋' };
  };
  const trend = getTrend();

  const fmtMo = m => {
    const [y, mo] = m.split('-');
    return `${Number(mo)}月`;
  };
  const fmtMoFull = m => {
    const [y, mo] = m.split('-');
    return `${y}年${Number(mo)}月`;
  };

  return (
    <>
      {/* ─ 傾向バッジ ─ */}
      {trend && (
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:14 }}>
          <span style={{ fontSize:13, color:'var(--text-sub)' }}>直近の傾向</span>
          <span className="trend-badge" style={{ background:trend.bg, color:trend.color }}>
            {trend.icon} {trend.label}
          </span>
        </div>
      )}

      {/* ─ 月別バーチャート（実施回数） ─ */}
      <div className="card" style={{ marginBottom:12 }}>
        <div className="card-title">月別生活変化チェック実施回数</div>
        <div className="trend-chart">
          {months.map(m => {
            const s   = monthMap[m].sessions;
            const pct = Math.round((s / maxSessions) * 80);
            /* 「要確認」レベルのチェックが過半数を占める月のみ強調 */
            const highRisk = myChecks.filter(c => c.date.slice(0,7) === m && c.level === 'high').length;
            const warn = highRisk > 0 && highRisk >= Math.ceil(s / 2);
            return (
              <div key={m} className="trend-col">
                <div className="trend-bar-num">{s}回</div>
                <div className={`trend-bar${warn?' warn':''}`} style={{ height: Math.max(pct, 6) + 'px', width:'100%' }} />
                <div className="trend-bar-mo">{fmtMo(m)}</div>
              </div>
            );
          })}
        </div>
      </div>

      {/* ─ 月別テキスト詳細 ─ */}
      <div className="card" style={{ marginBottom:12 }}>
        <div className="card-title">月別の記録</div>
        {months.map((m, i) => {
          const s     = monthMap[m].sessions;
          const prev  = i > 0 ? monthMap[months[i-1]].sessions : null;
          const diff  = prev !== null ? s - prev : null;
          const items = [...monthMap[m].ids].map(id => CHECK_QS.find(q => q.id === id)?.text).filter(Boolean);
          return (
            <div key={m} style={{ padding:'10px 0', borderBottom: i < months.length-1 ? '1px solid var(--border)' : 'none' }}>
              <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:4 }}>
                <span style={{ fontSize:14, fontWeight:700, color:'var(--text)' }}>{fmtMoFull(m)}</span>
                <span style={{ display:'flex', alignItems:'center', gap:6 }}>
                  <span style={{ fontSize:14, fontWeight:700, color:'var(--text)' }}>
                    {s}回
                  </span>
                  {diff !== null && diff !== 0 && (
                    <span style={{ fontSize:12, color: diff > 0 ? 'var(--accent)' : 'var(--green)', fontWeight:600 }}>
                      {diff > 0 ? `▲${diff}` : `▼${Math.abs(diff)}`}
                    </span>
                  )}
                </span>
              </div>
              {items.length > 0 && (
                <div style={{ display:'flex', flexWrap:'wrap', gap:5 }}>
                  {items.map(t => (
                    <span key={t} style={{ fontSize:11, background:'var(--primary-bg)', color:'var(--primary)', padding:'3px 8px', borderRadius:12, fontWeight:500 }}>
                      {CAT_EMOJI[t]||'●'} {t}
                    </span>
                  ))}
                </div>
              )}
            </div>
          );
        })}
      </div>

      {/* ─ 項目別推移 ─ */}
      {Object.keys(itemMonths).length > 0 && (
        <div className="card">
          <div className="card-title">項目別の出現状況</div>
          {Object.entries(itemMonths)
            .sort((a,b) => b[1].size - a[1].size)
            .map(([text, mSet]) => {
              const cnt = mSet.size;
              return (
                <div key={text} style={{ display:'flex', alignItems:'center', gap:10, padding:'9px 0', borderBottom:'1px solid var(--border)' }}>
                  <span style={{ fontSize:20, width:26 }}>{CAT_EMOJI[text]||'📌'}</span>
                  <div style={{ flex:1 }}>
                    <div style={{ fontSize:13, fontWeight:600, color:'var(--text)' }}>{text}</div>
                    <div style={{ fontSize:11, color:'var(--text-sub)', marginTop:2 }}>
                      {[...mSet].sort().map(fmtMoFull).join(' / ')}
                    </div>
                  </div>
                  <span style={{ fontSize:13, fontWeight:700, color: cnt >= 3 ? 'var(--accent)' : 'var(--text-sub)', whiteSpace:'nowrap' }}>
                    {cnt}ヶ月
                  </span>
                </div>
              );
          })}
        </div>
      )}
    </>
  );
}

/* ═══════════════════════════════════════════════════
   相談先メモタブ

const CONSULT_TYPES = [
  { value:'doctor',   label:'かかりつけ医',         icon:'🏥' },
  { value:'hospital', label:'医療機関名',           icon:'🏨' },
  { value:'careman',  label:'担当ケアマネジャー',   icon:'👩‍⚕️' },
  { value:'chiiki',   label:'地域包括支援センター', icon:'🏢' },
  { value:'houmon',   label:'訪問介護事業所',       icon:'🚗' },
  { value:'shisetsu', label:'施設名',               icon:'🏠' },
  { value:'other',    label:'その他相談先',         icon:'💬' },
];

function ConsultTab({ person, onUpdatePerson }) {
  const consultees = person.consultees || [];
  const [editId, setEditId] = useState(null);
  const [form,   setForm]   = useState({ type:'doctor', name:'', contact:'', memo:'' });

  const getIcon  = v => CONSULT_TYPES.find(t => t.value === v)?.icon  || '💬';
  const getLabel = v => CONSULT_TYPES.find(t => t.value === v)?.label || 'その他';

  const openNew  = () => { setForm({ type:'doctor', name:'', contact:'', memo:'' }); setEditId('new'); };
  const openEdit = c   => { setForm({ type:c.type, name:c.name, contact:c.contact||'', memo:c.memo||'' }); setEditId(c.id); };
  const closeForm = () => setEditId(null);

  const saveForm = () => {
    if (!form.name.trim()) return;
    const updated = editId === 'new'
      ? [...consultees, { id: Date.now(), ...form }]
      : consultees.map(c => c.id === editId ? { ...c, ...form } : c);
    onUpdatePerson({ ...person, consultees: updated });
    setEditId(null);
  };

  const del = id => {
    if (window.confirm('この相談先を削除しますか？'))
      onUpdatePerson({ ...person, consultees: consultees.filter(c => c.id !== id) });
  };

  return (
    <>
      <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:12 }}>
        <div style={{ fontSize:13, color:'var(--text-sub)' }}>{person.name}さんの相談先・連絡先</div>
        {editId === null && (
          <button className="btn btn-primary btn-sm" onClick={openNew}>
            <Ic n="plus" s={14} c="#fff" />相談先を追加
          </button>
        )}
      </div>

      {/* 入力フォーム */}
      {editId !== null && (
        <div className="card" style={{ border:'2px solid var(--primary)', marginBottom:14 }}>
          <div className="card-title">{editId === 'new' ? '相談先を追加' : '相談先を編集'}</div>
          <div className="form-group">
            <label className="form-label">種別</label>
            <select className="form-input" value={form.type}
              onChange={e => setForm(f => ({ ...f, type: e.target.value }))}>
              {CONSULT_TYPES.map(t => (
                <option key={t.value} value={t.value}>{t.icon} {t.label}</option>
              ))}
            </select>
          </div>
          <div className="form-group">
            <label className="form-label">名称・担当者名 <span style={{ color:'var(--accent)' }}>*</span></label>
            <input className="form-input" value={form.name}
              placeholder="例: ○○内科クリニック、担当: ○○先生"
              onChange={e => setForm(f => ({ ...f, name: e.target.value }))} />
          </div>
          <div className="form-group">
            <label className="form-label">電話番号・連絡先</label>
            <input className="form-input" value={form.contact}
              placeholder="例: 03-0000-0000"
              onChange={e => setForm(f => ({ ...f, contact: e.target.value }))} />
          </div>
          <div className="form-group">
            <label className="form-label">メモ（次回受診日・相談内容など）</label>
            <textarea className="form-input" rows={3} value={form.memo}
              placeholder={'例: 次回受診日 7月15日\n担当: ○○先生\n高血圧の件で相談済み'}
              onChange={e => setForm(f => ({ ...f, memo: e.target.value }))}
              style={{ resize:'none', lineHeight:1.65 }} />
          </div>
          <div style={{ display:'flex', gap:10 }}>
            <button className="btn btn-outline" style={{ flex:1 }} onClick={closeForm}>キャンセル</button>
            <button className="btn btn-primary" style={{ flex:1 }} onClick={saveForm}
              disabled={!form.name.trim()}>
              {editId === 'new' ? '追加する' : '保存する'}
            </button>
          </div>
        </div>
      )}

      {/* 空状態 */}
      {consultees.length === 0 && editId === null && (
        <div className="empty" style={{ padding:'32px 0' }}>
          <div className="empty-icon">🏥</div>
          <p style={{ fontSize:14, color:'var(--text-sub)', lineHeight:1.7 }}>
            かかりつけ医やケアマネジャー、<br/>地域包括支援センターなどを<br/>登録しておくと便利です。<br/><br/>「相談先を追加」から登録してください。
          </p>
        </div>
      )}

      {/* カード一覧 */}
      {consultees.map(c => (
        <div key={c.id} className="card" style={{ marginBottom:10, padding:'14px 14px 12px' }}>
          <div style={{ display:'flex', alignItems:'flex-start', justifyContent:'space-between', gap:8 }}>
            <div style={{ display:'flex', alignItems:'flex-start', gap:10, flex:1, minWidth:0 }}>
              <span style={{ fontSize:24, flexShrink:0, marginTop:1 }}>{getIcon(c.type)}</span>
              <div style={{ flex:1, minWidth:0 }}>
                <div style={{ fontSize:11, color:'var(--primary)', fontWeight:700, marginBottom:3, letterSpacing:'.02em' }}>
                  {getLabel(c.type)}
                </div>
                <div style={{ fontSize:15, fontWeight:700, color:'var(--text)', wordBreak:'break-all' }}>
                  {c.name}
                </div>
                {c.contact && (
                  <div style={{ fontSize:13, color:'var(--primary)', marginTop:5 }}>
                    📞 {c.contact}
                  </div>
                )}
                {c.memo && (
                  <div style={{ fontSize:12, color:'var(--text-sub)', marginTop:7, lineHeight:1.7,
                    whiteSpace:'pre-wrap', wordBreak:'break-all',
                    background:'var(--bg)', borderRadius:8, padding:'8px 10px' }}>
                    {c.memo}
                  </div>
                )}
              </div>
            </div>
            <div style={{ display:'flex', gap:2, flexShrink:0 }}>
              <button onClick={() => openEdit(c)}
                style={{ background:'none', border:'none', cursor:'pointer', padding:'4px 8px',
                  color:'var(--primary)', fontSize:12, fontWeight:600 }}>編集</button>
              <button onClick={() => del(c.id)}
                style={{ background:'none', border:'none', cursor:'pointer', padding:'4px 6px' }}>
                <Ic n="trash" s={15} c="var(--text-light)" />
              </button>
            </div>
          </div>
        </div>
      ))}
    </>
  );
}

function FamilyScreen({ person, records, checkHistory, onBack, onAddRecord, onEditRecord, onDeleteRecord, onUpdatePerson, onStartCheck }) {
  const [tab, setTab] = useState('records');
  const myRecords = [...records].filter(r => r.personId === person.id)
                                .sort((a,b) => (b.date+b.time).localeCompare(a.date+a.time));
  const catCounts = {};
  myRecords.forEach(r => r.cats.forEach(c => { catCounts[c] = (catCounts[c]||0)+1; }));

  /* 次回チェック予定日を計算 */
  const nextCheckDate = (() => {
    if (!person.lastCheckDate) return null;
    const days = CHECK_INTERVAL_DAYS[person.checkInterval];
    if (!days) return null;
    const d = new Date(person.lastCheckDate);
    d.setDate(d.getDate() + days);
    return d;
  })();
  const nextCheckStr = nextCheckDate
    ? `${nextCheckDate.getMonth()+1}/${nextCheckDate.getDate()}`
    : null;

  const due = isCheckDue(person);
  const dueText = getCheckDueText(person);

  return (
    <div className="page anim">
      <div className="page-header">
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <button onClick={onBack} style={{ background:'none', border:'none', cursor:'pointer' }}>
            <Ic n="left" s={24} c="var(--primary)" />
          </button>
          <div style={{ display:'flex', alignItems:'center', gap:8 }}>
            <span style={{ fontSize:28 }}>{person.emoji}</span>
            <div>
              <h1>{person.name}（{person.relation}）</h1>
              <p>記録 {myRecords.length}件 · チェック {checkHistory.filter(c => c.personId === person.id).length}回</p>
              {due ? (
                <p style={{ color:'#B86000', fontWeight:700, fontSize:12, marginTop:2 }}>
                  🔔 生活変化チェックの時期です
                  {dueText && <span style={{ fontWeight:400, marginLeft:4 }}>（{dueText}）</span>}
                </p>
              ) : (
                <p style={{ color:'var(--text-sub)', fontSize:12, marginTop:2 }}>
                  {person.lastCheckDate
                    ? nextCheckStr
                      ? `次回チェック予定: ${nextCheckStr}`
                      : `前回チェック: ${fmtShort(person.lastCheckDate)}`
                    : 'まだ生活変化チェックをしていません'}
                </p>
              )}
            </div>
          </div>
        </div>
        <div className="tab-bar" style={{ marginTop:12, marginBottom:0, overflowX:'auto' }}>
          {[['records','最近の記録'],['trend','変化の推移'],['consult','相談先メモ']].map(([id,label]) => (
            <button key={id} className={`tab-btn ${tab===id?'active':''}`} onClick={() => setTab(id)}
              style={{ whiteSpace:'nowrap', flexShrink:0 }}>{label}</button>
          ))}
        </div>
      </div>

      <div className="page-body">
        {/* ─ Tab: records ─ */}
        {tab === 'records' && (
          <>
            {/* チェックボタン */}
            {due && (
              <div style={{
                display:'flex', alignItems:'flex-start', gap:8,
                background:'#FFFBEA', border:'1.5px solid #F5C842',
                borderRadius:12, padding:'11px 14px', marginBottom:10,
              }}>
                <span style={{ fontSize:18, flexShrink:0, marginTop:1 }}>⚠️</span>
                <div>
                  <div style={{ fontSize:14, fontWeight:800, color:'#5A3A00' }}>生活変化チェックの時期です</div>
                  <div style={{ fontSize:12, color:'#7A5A20', marginTop:2 }}>最近の様子を確認してみましょう</div>
                </div>
              </div>
            )}

            {/* チェック時期：チェックボタンが上 / 通常：記録追加が上 */}
            {due && (
              <button onClick={() => onStartCheck(person)} style={{
                width:'100%', display:'flex', alignItems:'center', justifyContent:'center', gap:8,
                marginBottom:10, padding:'15px', borderRadius:12,
                border:'none', cursor:'pointer', fontFamily:'inherit',
                background:'#F5C842', color:'#5A3A00',
                fontSize:16, fontWeight:800,
                boxShadow:'0 3px 10px rgba(245,200,66,.45)',
              }}>
                🔔 生活変化チェックをする
              </button>
            )}

            <button className="btn btn-green btn-full" style={{ marginBottom:10 }} onClick={() => onAddRecord(person.id)}>
              <Ic n="plus" s={16} c="#fff" />気づき記録を追加
            </button>

            {!due && (
              <button onClick={() => onStartCheck(person)} style={{
                width:'100%', display:'flex', alignItems:'center', justifyContent:'center', gap:8,
                marginBottom:14, padding:'13px', borderRadius:12,
                border:'1.5px solid var(--primary)', cursor:'pointer', fontFamily:'inherit',
                background:'var(--surface)', color:'var(--primary)',
                fontSize:15, fontWeight:700,
              }}>
                🔍 生活変化チェックをする
              </button>
            )}
            {myRecords.length === 0 && (
              <div className="empty"><div className="empty-icon">📭</div><p>まだ記録がありません</p></div>

              const sc = SCENES.find(s => s.id === r.sceneId);

                          ✏️
                        </button>
                      )}
                      <button onClick={() => onDeleteRecord && onDeleteRecord(r.id)}
                        style={{ background:'none', border:'none', cursor:'pointer', padding:'2px 4px' }}>
                        <Ic n="trash" s={14} c="var(--text-light)" />

                  {scLabel && (
                    <div style={{ fontSize:12, color:'var(--primary)', fontWeight:600, margin:'3px 0' }}>
                      {scLabel}

                  )}
                  {r.cats?.length > 0 && (
                    <div className="memo-block-title">{r.cats.map(c => (CAT_EMOJI[c]||'📌')+' '+c).join('　')}</div>
                  )}
                  {r.memo && <div className="memo-block-body">{r.memo}</div>}
                </div>
              );
            })}
          </>
        )}

        {/* ─ Tab: trend ─ */}
        {tab === 'trend' && (
          <TrendView person={person} checkHistory={checkHistory} />
        )}

        {/* ─ Tab: consult ─ */}
        {tab === 'consult' && (
          <ConsultTab person={person} onUpdatePerson={onUpdatePerson} />
        )}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   生活変化チェック
═══════════════════════════════════════════════════ */
function CheckScreen({ persons, initialPerson, records, onBack, onSave }) {
  const [step,   setStep]   = useState(initialPerson ? 1 : 0);
  const [person, setPerson] = useState(initialPerson || null);
  const [ans,    setAns]    = useState({});
  const total = 2;

  const toggle = id => setAns(p => ({ ...p, [id]: !p[id] }));
  const checked = CHECK_QS.filter(q => ans[q.id]);

  const getResult = () => {
    const n = checked.length;
    if (n >= 5) return { level:'high', label:'複数の変化が見られます',   color:'#D9534F', bg:'#FEF0EB', icon:'🔴' };
    if (n >= 3) return { level:'mid',  label:'気になる変化があります',    color:'var(--accent)', bg:'var(--accent-light)', icon:'🟡' };
    if (n >= 1) return { level:'low',  label:'軽度の変化が見られます',    color:'var(--primary)', bg:'var(--primary-bg)', icon:'🔵' };
    return         { level:'ok',   label:'特に気になる変化はありません', color:'var(--green)', bg:'var(--green-light)', icon:'🟢' };
  };

  /* ── STEP 0: 家族選択 ── */
  if (step === 0) return (
    <div className="page anim">
      <div className="page-header">
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <button onClick={onBack} style={{ background:'none', border:'none', cursor:'pointer' }}>
            <Ic n="left" s={24} c="var(--primary)" />
          </button>
          <div><h1>生活変化チェック</h1><p>対象の家族を選んでください</p></div>
        </div>
      </div>
      <div className="page-body">
        <div className="alert alert-info" style={{ marginBottom:14 }}>
          <Ic n="info" s={15} c="var(--primary)" />
          <span style={{ fontSize:13, color:'var(--primary-dark)', lineHeight:1.6 }}>
            最近2週間の様子をチェックします。気になる変化にチェックを入れてください。
          </span>
        </div>
        {persons.map(p => (
          <div key={p.id} className="family-row" onClick={() => { setPerson(p); setAns({}); setStep(1); }}>
            <div className="family-emoji" style={{ fontSize:26 }}>{p.emoji}</div>
            <div style={{ flex:1 }}>
              <div className="family-name">{p.name}（{p.relation}）</div>
              <div className="family-sub">
                {getCheckDueText(p) || (p.lastCheckDate ? `前回: ${fmtDateSlash(p.lastCheckDate)}` : 'まだチェックしていません')}
              </div>
            </div>
            {isCheckDue(p) && <span className="badge badge-due" style={{ marginRight:6, flexShrink:0 }}>チェック時期</span>}
            <Ic n="right" s={18} c="var(--text-light)" />
          </div>
        ))}
      </div>
    </div>
  );

  /* ── STEP 1〜2: チェック（4問ずつ2ページ） ── */
  if (step <= total) {
    const qs = CHECK_QS.slice((step - 1) * 4, step * 4);
    return (
      <div className="page anim">
        <div className="page-header">
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
            <div style={{ display:'flex', alignItems:'center', gap:10 }}>
              <button onClick={() => setStep(step - 1)} style={{ background:'none', border:'none', cursor:'pointer' }}>
                <Ic n="left" s={24} c="var(--primary)" />
              </button>
              <div><h1>生活変化チェック</h1><p>{person.name}さん · {step}/{total}</p></div>
            </div>
            <span style={{ fontSize:13, color:'var(--text-sub)', fontWeight:600 }}>
              {checked.length} 項目
            </span>
          </div>
          <div className="progress-bar">
            <div className="progress-fill" style={{ width:`${(step / (total + 1)) * 100}%` }} />
          </div>
        </div>
        <div className="page-body">
          <div style={{ fontSize:13, color:'var(--text-sub)', marginBottom:14 }}>
            最近2週間で気になる変化はありますか？（複数可）
          </div>
          {qs.map(q => (
            <div key={q.id} className={`check-item ${ans[q.id] ? 'on' : ''}`} onClick={() => toggle(q.id)}>
              <div className="checkbox">
                {ans[q.id] && <svg viewBox="0 0 12 10" width="12" height="10"><polyline points="1,5 4.5,8.5 11,1" stroke="white" strokeWidth="2" fill="none" strokeLinecap="round" strokeLinejoin="round"/></svg>}
              </div>
              <label style={{ fontSize:14, color:'var(--text)', cursor:'pointer', lineHeight:1.5 }}>{q.text}</label>
            </div>
          ))}
          <div style={{ marginTop:16 }}>
            {step < total
              ? <button className="btn btn-primary btn-full" onClick={() => setStep(step + 1)}>次へ</button>
              : <button className="btn btn-primary btn-full" onClick={() => setStep(total + 1)}>結果を見る</button>
            }
          </div>
        </div>
      </div>
    );
  }

  /* ─ result ─ */
  const res = getResult();
  return (
    <div className="page anim">
      <div className="page-header">
        <div style={{ display:'flex', alignItems:'center', gap:10 }}>
          <button onClick={onBack} style={{ background:'none', border:'none', cursor:'pointer' }}>
            <Ic n="left" s={24} c="var(--primary)" />
          </button>
          <h1>チェック結果</h1>
        </div>
      </div>
      <div className="page-body">
        <div style={{ background:res.bg, border:`2px solid ${res.color}30`, borderRadius:14, padding:'20px 16px', textAlign:'center', marginBottom:16 }}>
          <div style={{ fontSize:40, marginBottom:8 }}>{res.icon}</div>
          <div style={{ fontSize:18, fontWeight:800, color:res.color, marginBottom:8 }}>{res.label}</div>
          {checked.length > 0
            ? <p style={{ fontSize:13, color:'var(--text-sub)', lineHeight:1.65 }}>{checked.length}項目の変化が記録されました。記録を保存して、相談の参考にしましょう。</p>
            : <p style={{ fontSize:13, color:'var(--text-sub)' }}>気になる変化は見られませんでした。引き続き様子を見ましょう。</p>
          }
        </div>

        {checked.length > 0 && (
          <>
            <div className="section-title">チェックされた変化</div>
            {checked.map(q => (
              <div key={q.id} className="memo-block" style={{ borderLeftColor: res.color }}>
                <div className="memo-block-body">{CAT_EMOJI[q.text]||'●'} {q.text}</div>
              </div>
            ))}
            <div className="section-title" style={{ marginTop:16 }}>次のステップ</div>
            <div className="card">
              {[
                { n:1, text:'家族内で情報を共有する', icon:'👨‍👩‍👧' },
                { n:2, text:'地域包括支援センターへ相談', icon:'🏢' },
                { n:3, text:'かかりつけ医への受診を検討', icon:'🏥' },
              ].filter((_,i) => i < checked.length).map(s => (
                <div key={s.n} style={{ display:'flex', alignItems:'center', gap:12, padding:'10px 0', borderBottom:'1px solid var(--border)' }}>
                  <span className="step-num">{s.n}</span>
                  <span style={{ fontSize:14, color:'var(--text)', fontWeight:500 }}>{s.icon} {s.text}</span>
                </div>
              ))}
            </div>
          </>
        )}

        <div style={{ display:'flex', gap:10, marginTop:8 }}>
          <button className="btn btn-outline" style={{ flex:1 }}
            onClick={() => onSave({ person, ans, res, checked })}>
            記録に保存
          </button>
          <button className="btn btn-primary" style={{ flex:1 }} onClick={onBack}>完了</button>
        </div>
      </div>
    </div>
  );
}

  { id:'living',   label:'居間',       icon:'🛋',

function RecordForm({ persons, initialPersonId, onBack, onSave, initial = null }) {
  const today = new Date().toISOString().split('T')[0];
  const now   = new Date().toTimeString().slice(0,5);
  const [date,      setDate]      = useState(initial?.date     || today);
  const [time,      setTime]      = useState(initial?.time     || now);
  const [personId,  setPersonId]  = useState(initial?.personId || initialPersonId || persons[0]?.id || 1);
  const [cats,      setCats]      = useState(initial?.cats     || []);
  const [memo,      setMemo]      = useState(initial?.memo     || '');
  const [sceneId,   setSceneId]   = useState(initial?.sceneId  || '');
  const [otherText, setOtherText] = useState(initial?.place    || '');

  const scene = SCENES.find(s => s.id === sceneId);
  const toggleCat = c => setCats(p => p.includes(c) ? p.filter(x=>x!==c) : [...p,c]);

  const memoRef = React.useRef(null);
  const [hintToast, setHintToast] = useState(false);
  const addHint = h => {
    setMemo(prev => prev ? prev + '\n' + h : h);
    setHintToast(true);
    setTimeout(() => setHintToast(false), 1800);
    setTimeout(() => memoRef.current?.scrollIntoView({ behavior:'smooth', block:'center' }), 50);
  };

  const handleSave = () => {
    if (!memo && cats.length === 0) { alert('「気になったこと」か「詳細メモ」を入力してください'); return; }
    const place = sceneId === 'other' ? (otherText || 'その他') : (scene?.label || '');
    onSave({ id: initial?.id || Date.now(), date, time, personId: Number(personId), cats, memo, place, sceneId });
  };

  return (
    <div className="page anim">
      <div className="page-header">
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between' }}>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            <button onClick={onBack} style={{ background:'none', border:'none', cursor:'pointer' }}>
              <Ic n="x" s={22} c="var(--text-sub)" />
            </button>
            <h1>{initial ? '記録を編集' : '気づき記録を追加'}</h1>
          </div>
          <button className="btn btn-green btn-sm" onClick={handleSave}>保存</button>
        </div>
      </div>
      <div className="page-body">

        {/* ─ 対象の家族 ─ */}
        <div className="form-group">
          <label className="form-label">対象の家族</label>
          <select className="form-input" value={personId} onChange={e => setPersonId(e.target.value)}>
            {persons.map(p => <option key={p.id} value={p.id}>{p.emoji} {p.name}（{p.relation}）</option>)}
          </select>
        </div>

        {/* ─ 日付・時刻 ─ */}
        <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
          <div className="form-group">
            <label className="form-label">日付</label>
            <input type="date" className="form-input" value={date} onChange={e => setDate(e.target.value)} />
          </div>
          <div className="form-group">
            <label className="form-label">時刻</label>
            <input type="time" className="form-input" value={time} onChange={e => setTime(e.target.value)} />
          </div>
        </div>

        {/* ─ 気になったこと ─ */}
        <div className="form-group">
          <label className="form-label">気になったこと <span style={{ fontSize:11, color:'var(--text-sub)', fontWeight:400 }}>（複数選択可）</span></label>
          <div className="chip-group">
            {CATS.map(c => <button key={c} className={`chip ${cats.includes(c)?'on':''}`} onClick={() => toggleCat(c)}>{c}</button>)}
          </div>
        </div>

        {/* ─ 気づいた場面 ─ */}
        <div className="form-group">
          <label className="form-label">気づいた場面</label>
          <div style={{ position:'relative' }}>
            <select className="form-input"
              value={sceneId}
              onChange={e => { setSceneId(e.target.value); setOtherText(''); }}
              style={{ paddingLeft:14, appearance:'none', WebkitAppearance:'none' }}>
              <option value="">選択してください</option>
              {SCENES.map(s => <option key={s.id} value={s.id}>{s.icon} {s.label}</option>)}
            </select>
            <span style={{ position:'absolute', right:14, top:'50%', transform:'translateY(-50%)', fontSize:12, color:'var(--text-sub)', pointerEvents:'none' }}>▼</span>
          </div>

          {sceneId === 'other' && (
            <input type="text" className="form-input" style={{ marginTop:8 }}
              value={otherText} onChange={e => setOtherText(e.target.value)}
              placeholder="場所や場面を入力してください" autoFocus />
          )}

          {/* 入力例ヒント */}
          {scene && scene.hints.length > 0 && (
            <div style={{ marginTop:10, background:'var(--primary-bg)', borderRadius:10, padding:'10px 14px' }}>
              <div style={{ fontSize:12, fontWeight:700, color:'var(--primary-dark)', marginBottom:6 }}>
                {scene.icon} {scene.label}での入力例（タップで追加）
              </div>
              {scene.hints.map(h => (
                <button key={h}
                  onClick={() => addHint(h)}
                  style={{
                    display:'flex', alignItems:'center', gap:8, width:'100%',
                    background:'none', border:'none', cursor:'pointer',
                    padding:'6px 0', textAlign:'left', fontFamily:'inherit',
                    borderBottom:'1px solid rgba(74,144,164,.12)',
                  }}>
                  <span style={{ fontSize:16, color:'var(--primary)', flexShrink:0, fontWeight:700 }}>＋</span>
                  <span style={{ fontSize:13, color:'var(--text-sub)', lineHeight:1.5 }}>{h}</span>
                </button>
              ))}
            </div>
          )}
        </div>

        {/* ─ 詳細メモ ─ */}
        <div className="form-group" style={{ position:'relative' }}>
          <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:4 }}>
            <label className="form-label" style={{ marginBottom:0 }}>詳細メモ</label>
            {hintToast && (
              <span style={{
                fontSize:12, fontWeight:700, color:'var(--green)',
                background:'var(--green-light)', padding:'3px 10px', borderRadius:20,
                animation:'fadeInOut 1.8s ease forwards',
              }}>
                ✓ 詳細メモに追加しました
              </span>
            )}
          </div>
          <textarea ref={memoRef} className="form-input" style={{ resize:'none', height:96 }}
            value={memo} onChange={e => setMemo(e.target.value)}
            placeholder="気づいたこと、会話の内容など自由に記録できます&#10;（上の入力例をタップすると自動入力されます）" />
        </div>

        {/* ─ 写真 ─ */}
        <div className="form-group">
          <label className="form-label">写真 <span style={{ fontSize:11, color:'var(--text-sub)', fontWeight:400 }}>（任意）</span></label>
          <div style={{ width:72, height:72, background:'var(--bg)', borderRadius:10, display:'flex', alignItems:'center', justifyContent:'center', border:'2px dashed var(--border)', cursor:'pointer' }}>
            <Ic n="camera" s={24} c="var(--text-light)" />
          </div>
          <div style={{ fontSize:11, color:'var(--text-sub)', marginTop:5 }}>※ β版では写真保存はデモ表示のみです</div>
        </div>
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   記録一覧（月別・日付別グループ表示）
═══════════════════════════════════════════════════ */
function RecordsScreen({ persons, records, onAddRecord, onDeleteRecord, onEditRecord }) {
  const [filterPerson, setFilterPerson] = useState('all');
  const [seg, setSeg] = useState('all');

  const sorted   = [...records].sort((a,b) => (b.date+b.time).localeCompare(a.date+a.time));
  const filtered = sorted.filter(r => {
    if (filterPerson !== 'all' && r.personId !== Number(filterPerson)) return false;
    if (seg === 'check' && !r.fromCheck) return false;
    if (seg === 'memo'  &&  r.fromCheck) return false;
    return true;
  });

  /* 月別グループ → 日付別グループ に変換 */
  const monthGroups = [];
  filtered.forEach(r => {
    const mo = r.date.slice(0, 7);            /* 2025-06 */
    const dy = r.date;                         /* 2025-06-10 */
    let mg = monthGroups.find(g => g.month === mo);
    if (!mg) { mg = { month: mo, days: [] }; monthGroups.push(mg); }
    let dg = mg.days.find(d => d.date === dy);
    if (!dg) { dg = { date: dy, items: [] }; mg.days.push(dg); }
    dg.items.push(r);
  });

  const fmtMonthHead = mo => {
    const [y, m] = mo.split('-');
    return `${y}年${Number(m)}月`;
  };

  return (
    <div className="page anim">
      <div className="page-header">
        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:10 }}>
          <div><h1>記録一覧</h1><p>家族の変化を時系列で確認</p></div>
          <button className="btn btn-green btn-sm" onClick={() => onAddRecord(null)} style={{ gap:4 }}>
            <Ic n="plus" s={14} c="#fff" />追加
          </button>
        </div>
        <select className="form-input" style={{ marginBottom:10, fontSize:13, padding:'8px 12px' }}
          value={filterPerson} onChange={e => setFilterPerson(e.target.value)}>
          <option value="all">すべての家族</option>
          {persons.map(p => <option key={p.id} value={p.id}>{p.emoji} {p.name}</option>)}
        </select>
        <div className="segment" style={{ marginBottom:0 }}>
          <button className={`seg-btn ${seg==='all'  ?'active':''}`} onClick={() => setSeg('all')}>すべて</button>
          <button className={`seg-btn ${seg==='memo' ?'active':''}`} onClick={() => setSeg('memo')}>気づき記録</button>
          <button className={`seg-btn ${seg==='check'?'active':''}`} onClick={() => setSeg('check')}>チェック結果</button>
        </div>
      </div>

      <div className="page-body">
        {filtered.length === 0 && (
          <div className="empty">
            <div className="empty-icon">📭</div>
            <p>記録がありません。<br/>「+追加」から記録を始めましょう。</p>
          </div>
        )}

        {monthGroups.map(mg => (
          <div key={mg.month}>
            {/* ── 月見出し ── */}
            <div style={{
              fontSize:15, fontWeight:800, color:'var(--primary-dark)',
              padding:'6px 0 8px',
              borderBottom:'2px solid var(--primary)',
              marginBottom:12,
              display:'flex', alignItems:'center', justifyContent:'space-between',
            }}>
              <span>{fmtMonthHead(mg.month)}</span>
              <span style={{ fontSize:12, fontWeight:400, color:'var(--text-sub)' }}>
                {mg.days.reduce((s,d) => s + d.items.length, 0)}件
              </span>
            </div>

            {/* ── 日付グループ ── */}
            {mg.days.map(dg => {
              const [,mo,dy] = dg.date.split('-');
              const dayLabel = `${Number(mo)}/${Number(dy)}`;
              return (
                <div key={dg.date} style={{ marginBottom:16 }}>
                  {/* 日付バー */}
                  <div style={{
                    fontSize:13, fontWeight:700, color:'var(--text-sub)',
                    background:'var(--bg)', borderRadius:6,
                    padding:'4px 10px', marginBottom:8, display:'inline-block',
                  }}>
                    {dayLabel}
                  </div>

                  {/* その日のカード */}
                  {dg.items.map(r => {
                    const p     = persons.find(x => x.id === r.personId);
                    const scene = SCENES.find(s => s.id === r.sceneId);
                    const sceneLabel = scene ? `${scene.icon} ${scene.label}` : (r.place || null);
                    const isCheck = !!r.fromCheck;
                    return (
                      <div key={r.id} style={{
                        background:'var(--surface)', borderRadius:12,
                        border:'1px solid var(--border)',
                        padding:'12px 14px', marginBottom:8,
                        borderLeft: `4px solid ${isCheck ? 'var(--accent)' : 'var(--green)'}`,
                      }}>
                        {/* カードヘッダー */}
                        <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:6 }}>
                          <div style={{ display:'flex', alignItems:'center', gap:6 }}>
                            <span style={{ fontSize:15 }}>{isCheck ? '🔔' : '✏️'}</span>
                            <span style={{
                              fontSize:12, fontWeight:700,
                              color: isCheck ? 'var(--accent)' : 'var(--green)',
                            }}>
                              {isCheck ? '生活変化チェック' : '気づき記録'}
                            </span>
                            {r.time && (
                              <span style={{ fontSize:11, color:'var(--text-light)' }}>{r.time}</span>
                            )}
                          </div>
                          <div style={{ display:'flex', alignItems:'center', gap:4 }}>
                            {p && (
                              <span style={{ fontSize:12, color:'var(--text-sub)' }}>
                                {p.emoji} {p.name}
                              </span>
                            )}
                            {!isCheck && (
                              <button onClick={() => onEditRecord(r)}
                                style={{ background:'none', border:'none', cursor:'pointer',
                                  padding:'2px 6px', fontSize:13, color:'var(--primary)', fontWeight:600 }}>
                                ✏️
                              </button>
                            )}
                            <button onClick={() => onDeleteRecord(r.id)}
                              style={{ background:'none', border:'none', cursor:'pointer', padding:'2px 4px' }}>
                              <Ic n="trash" s={14} c="var(--text-light)" />
                            </button>
                          </div>
                        </div>

                        {/* 場面 */}
                        {sceneLabel && (
                          <div style={{ fontSize:12, color:'var(--primary)', marginBottom:4 }}>
                            {sceneLabel}
                          </div>
                        )}

                        {/* カテゴリ（箇条書き） */}
                        {r.cats?.length > 0 && (
                          <div style={{ marginBottom: r.memo ? 6 : 0 }}>
                            {r.cats.map(c => (
                              <div key={c} style={{ fontSize:13, color:'var(--text)', lineHeight:1.7 }}>
                                ・{CAT_EMOJI[c] || '●'} {c}
                              </div>
                            ))}
                          </div>
                        )}

                        {/* メモ */}
                        {r.memo && (
                          <div style={{
                            fontSize:13, color:'var(--text-sub)', lineHeight:1.65,
                            marginTop: r.cats?.length ? 4 : 0,
                            paddingTop: r.cats?.length ? 6 : 0,
                            borderTop: r.cats?.length ? '1px solid var(--border)' : 'none',
                          }}>
                            {r.memo}
                          </div>
                        )}
                      </div>
                    );
                  })}
                </div>
              );
            })}

            <div style={{ height:8 }} />
          </div>
        ))}
      </div>
    </div>
  );
}

/* ═══════════════════════════════════════════════════
   相談メモ
═══════════════════════════════════════════════════ */
function ReportScreen({ persons, records, checkHistory }) {
  const [from, setFrom] = useState('2025-04-01');
  const [to,   setTo]   = useState('2025-05-31');
  const [pid,  setPid]  = useState(persons[0]?.id || '');
  const [show, setShow] = useState(false);

  const person   = persons.find(p => p.id === Number(pid));
  const filtered = records.filter(r => r.personId === Number(pid) && r.date >= from && r.date <= to);
  const catCounts = {};
  filtered.forEach(r => r.cats?.forEach(c => { catCounts[c] = (catCounts[c]||0)+1; }));

  /* ─ チェック推移（相談メモ用） ─ */
  const myChecks = checkHistory
    .filter(c => c.personId === Number(pid) && c.date >= from && c.date <= to)
    .sort((a,b) => a.date.localeCompare(b.date));
  const trendMonths = {};
  checkHistory.filter(c => c.personId === Number(pid))
    .sort((a,b) => a.date.localeCompare(b.date))
    .forEach(c => {
      const m = c.date.slice(0,7);
      if (!trendMonths[m]) trendMonths[m] = 0;
      trendMonths[m] += c.count;
    });
  const trendKeys = Object.keys(trendMonths).sort().slice(-6);
  const getTrendLabel = () => {
    if (trendKeys.length < 3) return null;
    const half   = Math.floor(trendKeys.length / 2);
    const recent = trendKeys.slice(-half).reduce((s,m) => s + trendMonths[m], 0) / half;
    const older  = trendKeys.slice(0, half).reduce((s,m) => s + trendMonths[m], 0) / half;
    if (recent > older * 1.25) return { label:'増加傾向あり', color:'var(--accent)', icon:'📈' };
    if (recent < older * 0.75) return { label:'改善傾向あり', color:'var(--green)',  icon:'📉' };
    return                            { label:'横ばい',        color:'var(--primary)',icon:'➡️' };
  };
  const trendLabel = getTrendLabel();
  const fmtMoFull = m => { const [y,mo] = m.split('-'); return `${y}年${Number(mo)}月`; };

  return (
    <div className="page anim">
      <div className="page-header">
        <h1>相談メモ</h1>
        <p>医師・ケアマネ・地域包括支援センターへ</p>
      </div>
      <div className="page-body">
        {/* 目的説明（常時表示） */}
        <div className="alert alert-info" style={{ marginBottom:14, borderRadius:12 }}>
          <Ic n="info" s={15} c="var(--primary)" />
          <p style={{ fontSize:13, color:'var(--primary-dark)', lineHeight:1.65 }}>
            この相談メモは、特定の家族について医療・介護・福祉の専門職へ相談する際に利用するための資料です。
          </p>
        </div>

        {!show ? (
          <>
            <div className="card">
              <div className="card-title"><Ic n="file" s={14} c="var(--text-sub)" />相談メモの設定</div>
              <div className="form-group">
                <label className="form-label">相談したい家族</label>
                <select className="form-input" value={pid} onChange={e => { setPid(e.target.value); }}>
                  {persons.map(p => <option key={p.id} value={p.id}>{p.emoji} {p.name}（{p.relation}）</option>)}
                </select>
                <div style={{ fontSize:12, color:'var(--text-sub)', marginTop:6 }}>
                  複数の家族の記録をまとめて確認したい場合は「記録カレンダー」をご利用ください。
                </div>
              </div>
              <label className="form-label">期間</label>
              <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:10 }}>
                <input type="date" className="form-input" value={from} onChange={e => setFrom(e.target.value)} />
                <input type="date" className="form-input" value={to}   onChange={e => setTo(e.target.value)} />
              </div>
              <div style={{ marginTop:14, padding:'10px 12px', background:'var(--bg)', borderRadius:10 }}>
                <div style={{ fontSize:13, color:'var(--text-sub)' }}>
                  {person?.emoji} {person?.name}さんの記録:&nbsp;
                  <b style={{ color:'var(--primary)' }}>{filtered.length}件</b>
                </div>
              </div>
            </div>
            <button className="btn btn-primary btn-full" onClick={() => setShow(true)}>
              <Ic n="file" s={18} c="#fff" />相談メモを表示する
            </button>
          </>
        ) : (
          <>
            <div className="card" style={{ border:'2px solid var(--primary)' }}>
              <div style={{ textAlign:'center', paddingBottom:14, marginBottom:14, borderBottom:'2px solid var(--primary-bg)' }}>
                <div style={{ fontSize:11, color:'var(--text-sub)', letterSpacing:.8 }}>実家見守りノート</div>
                <div style={{ fontSize:18, fontWeight:800, color:'var(--text)', marginTop:4 }}>生活変化・相談メモ</div>
                <div style={{ fontSize:12, color:'var(--text-sub)', marginTop:4 }}>{from} 〜 {to}</div>
              </div>

              <div style={{ marginBottom:16 }}>
                <div className="report-h3">基本情報</div>
                <div className="report-row">
                  <span>対象</span>
                  <span style={{ fontWeight:700 }}>{person?.emoji} {person?.name}（{person?.relation}）</span>
                </div>
                <div className="report-row">
                  <span>記録件数</span>
                  <span style={{ fontWeight:700 }}>{filtered.length}件</span>
                </div>
                <div className="report-row">
                  <span>作成日</span>
                  <span>{new Date().toLocaleDateString('ja-JP')}</span>
                </div>
              </div>

              {/* ── 気づき記録まとめ ── */}
              <div style={{ marginBottom:16 }}>
                <div className="report-h3">【気づき記録】 事実の記録</div>

                      <div key={cat} className="report-row">
                        <span>{CAT_EMOJI[cat]||'●'} {cat}</span>
                        <span style={{ fontWeight:700, color: cnt>=3 ? 'var(--accent)' : 'var(--text)' }}>{cnt}件</span>
                      </div>
                    ))
                  : <div style={{ fontSize:13, color:'var(--text-sub)', padding:'4px 0' }}>この期間の気づき記録はありません</div>
                }
              </div>

              {/* ── 生活変化チェックまとめ ── */}
              <div style={{ marginBottom:16 }}>
                <div className="report-h3">【生活変化チェック】 傾向の確認</div>
                {(() => {
                  const qCounts = {};
                  myChecks.forEach(c => c.checkedIds?.forEach(id => { qCounts[id] = (qCounts[id]||0)+1; }));
                  const entries = Object.entries(qCounts).sort((a,b)=>b[1]-a[1]);
                  return entries.length > 0
                    ? entries.map(([qid, cnt]) => {
                        const q = CHECK_QS.find(x => x.id === qid);
                        return (
                          <div key={qid} className="report-row">
                            <span>☑ {q?.text||qid}</span>
                            <span style={{ fontWeight:700, color: cnt>=2 ? 'var(--accent)' : 'var(--text)' }}>{cnt}回</span>
                          </div>
                        );
                      })
                    : <div style={{ fontSize:13, color:'var(--text-sub)', padding:'4px 0' }}>この期間のチェック記録はありません</div>;
                })()}
              </div>

              {/* ─ 変化の推移 ─ */}
              {trendKeys.length > 0 && (
                <div style={{ marginBottom:16 }}>
                  <div className="report-h3">変化の推移</div>
                  {trendLabel && (
                    <div style={{ display:'flex', alignItems:'center', justifyContent:'space-between', marginBottom:8 }}>
                      <span style={{ fontSize:12, color:'var(--text-sub)' }}>全期間の傾向</span>
                      <span style={{ fontSize:13, fontWeight:700, color:trendLabel.color }}>{trendLabel.icon} {trendLabel.label}</span>
                    </div>
                  )}
                  {trendKeys.map((m, i) => {
                    const cnt  = trendMonths[m];
                    const prev = i > 0 ? trendMonths[trendKeys[i-1]] : null;
                    const diff = prev !== null ? cnt - prev : null;
                    return (
                      <div key={m} className="report-row">
                        <span>{fmtMoFull(m)}&emsp;チェック項目 {cnt}件</span>
                        {diff !== null && diff !== 0 && (
                          <span style={{ fontWeight:700, color: diff > 0 ? 'var(--accent)' : 'var(--green)', fontSize:12 }}>
                            {diff > 0 ? `▲${diff}` : `▼${Math.abs(diff)}`}
                          </span>
                        )}
                      </div>
                    );
                  })}
                </div>
              )}

              <div>
                <div className="report-h3">記録一覧</div>
                {filtered.slice(0,8).map(r => (
                  <div key={r.id} style={{ padding:'8px 0', borderBottom:'1px solid var(--border)' }}>
                    <div style={{ fontSize:11, color:'var(--text-sub)' }}>{r.date} {r.time}</div>
                    <div style={{ fontSize:13, fontWeight:600, color:'var(--text)', marginTop:2 }}>{r.cats?.join('・')||'メモ'}</div>
                    {r.memo && <div style={{ fontSize:12, color:'var(--text-sub)', marginTop:2 }}>{r.memo}</div>}
                  </div>
                ))}
                {filtered.length === 0 && <div style={{ fontSize:13, color:'var(--text-sub)' }}>この期間の記録はありません</div>}
              </div>

              <div style={{ marginTop:14, padding:'10px 12px', background:'var(--primary-bg)', borderRadius:10, fontSize:12, color:'var(--primary-dark)', lineHeight:1.65 }}>
                📌 このメモは、実家見守りノートで記録した内容をもとに作成されています。医師・ケアマネジャーに見せて、専門家のアドバイスを受けてください。
              </div>
            </div>
            <div style={{ display:'flex', gap:10, marginTop:4 }}>
              <button className="btn btn-outline" style={{ flex:1 }} onClick={() => setShow(false)}>
                <Ic n="left" s={16} c="var(--primary)" />設定に戻る
              </button>
              <button className="btn btn-primary" style={{ flex:1 }}
                onClick={() => {
                  /* ── PDF印刷用コンテンツを組み立ててブラウザ印刷 ── */
                  const fmtMo = m => { const [y,mo] = m.split('-'); return `${y}年${Number(mo)}月`; };
                  const rows = filtered.slice(0,20).map(r =>
                    `<tr><td>${r.date} ${r.time}</td><td>${r.cats?.join('・')||'メモ'}</td><td>${r.memo||''}</td></tr>`
                  ).join('');
                  /* 気づき記録セクション */
                  /* ── 【1】気づき記録：日時＋内容リスト ── */
                  const kidzukiList = filtered
                    .slice(0, 30)
                    .map(r => {
                      const dateStr = r.date ? r.date.replace(/-/g,'/') : '';
                      const cats    = r.cats?.join('・') || '';
                      const memo    = r.memo ? `<div style="color:#6B7F8E;font-size:11px;margin-top:2px">${r.memo}</div>` : '';
                      return `<div style="padding:6px 0;border-bottom:1px solid #DDE8ED">
                        <div style="font-size:11px;color:#6B7F8E">${dateStr}${r.time ? ' ' + r.time : ''}</div>
                        <div style="font-size:13px;font-weight:600;margin-top:2px">${cats || 'メモ'}</div>
                        ${memo}
                      </div>`;
                    }).join('');

                  /* ── 【2】生活変化チェック：月別チェック内容リスト ── */
                  const checksByMonth = {};
                  myChecks.forEach(c => {
                    const m = c.date.slice(0,7);
                    if (!checksByMonth[m]) checksByMonth[m] = new Set();
                    c.checkedIds?.forEach(id => checksByMonth[m].add(id));
                  });
                  const checkMonthRows = Object.keys(checksByMonth).sort().reverse().map(m => {
                    const [y, mo] = m.split('-');
                    const items = [...checksByMonth[m]]
                      .map(id => CHECK_QS.find(q => q.id === id)?.text)
                      .filter(Boolean)
                      .map(t => `<div style="padding:2px 0 2px 10px;font-size:12px">・${t}</div>`)
                      .join('');
                    return `<div style="margin-bottom:10px">
                      <div style="font-size:13px;font-weight:700;color:#2E6E82;margin-bottom:4px">${y}年${Number(mo)}月</div>
                      ${items || '<div style="font-size:12px;color:#6B7F8E;padding-left:10px">変化なし</div>'}
                    </div>`;
                  }).join('');

                  /* ── 【4】相談先一覧 ── */
                  const consultees = person?.consultees || [];
                  const consultRows = consultees.map(c => {
                    const typeLabel = CONSULT_TYPES.find(t => t.value === c.type)?.label || 'その他';
                    const contact   = c.contact ? `<div style="font-size:11px;color:#6B7F8E;margin-top:2px">📞 ${c.contact}</div>` : '';
                    const memo      = c.memo    ? `<div style="font-size:11px;color:#6B7F8E;margin-top:3px;white-space:pre-wrap">${c.memo}</div>` : '';
                    return `<div style="padding:8px 0;border-bottom:1px solid #DDE8ED">
                      <div style="font-size:11px;color:#4A90A4;font-weight:700">${typeLabel}</div>
                      <div style="font-size:13px;font-weight:700;margin-top:2px">${c.name}</div>
                      ${contact}${memo}
                    </div>`;
                  }).join('');

                  document.getElementById('print-area').innerHTML = `
                    <div class="p-header">
                      <div><div class="p-appname">実家見守りノート</div><h1>生活変化・相談メモ</h1><p class="p-sub">${from} 〜 ${to}</p></div>
                      <div style="text-align:right"><p class="p-sub">作成日: ${new Date().toLocaleDateString('ja-JP')}</p></div>
                    </div>

                    <h2>基本情報</h2>
                    <table>
                      <tr><td>対象</td><td><b>${person?.emoji} ${person?.name}（${person?.relation}）</b></td></tr>
                      <tr><td>記録件数</td><td><b>${filtered.length}件</b></td></tr>
                      <tr><td>期間</td><td>${from} 〜 ${to}</td></tr>
                    </table>

                    <h2>【気づき記録】 観察した事実</h2>
                    ${kidzukiList || '<p style="color:#6B7F8E;font-size:12px">この期間の気づき記録はありません</p>'}

                    <h2>【生活変化チェック】 確認した項目</h2>
                    ${checkMonthRows || '<p style="color:#6B7F8E;font-size:12px">この期間のチェック記録はありません</p>'}

                    ${consultRows ? `<div class="p-consult-list"><h2>相談先一覧</h2>${consultRows}</div>` : ''}

                    <div class="p-note">📌 このメモは実家見守りノートで記録した内容をもとに作成されています。医師・ケアマネジャーに見せて、専門家のアドバイスを受けてください。</div>
                  `;
                  window.print();
                  setTimeout(() => { document.getElementById('print-area').innerHTML = ''; }, 1000);
                }}>
                🖨 PDFで保存
              </button>
            </div>
          </>
        )}
      </div>
    </div>
  );
}

   設定
